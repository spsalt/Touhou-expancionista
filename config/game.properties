# Giro da esfera em radianos por tick. 0 = nao gira.
adriana.esfera.velocidadeGiro=0.008
# Desloca o centro da esfera pra baixo do chefe
adriana.esfera.deslocamentoY=60
# Tres esferas por ciclo, espacadas: viram cascas concentricas crescendo.
adriana.esfera.esferasPorCiclo=1
adriana.esfera.intervaloEntreEsferas=50
# Distancia percorrida em que a bala termina de virar violeta (nasce vermelha)
adriana.esfera.distanciaAteVioleta=200

# --- LIMITES DE VIDA DAS BALAS 3D ---
# Sair do campo NAO basta pra matar estas balas: a que viaja pelo eixo Z
# se afasta "pra dentro da tela", encolhe rumo ao centro e nunca cruza a
# borda. Sem os limites abaixo, metade da esfera ficava viva pra sempre e
# a tela ia entupindo a cada nova esfera.
#
# Distancia 3D maxima do centro antes da bala sumir.
adriana.esfera.alcanceMaximo=450
# Teto de tempo, em ticks. Deixe MENOR que adriana.esfera.cadencia pra
