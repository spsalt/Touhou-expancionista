# ---------------------------------------------------------------------
# GPT EXPANSAO (ataque especial — tecla V ou clique no logo do HUD)
# ---------------------------------------------------------------------
# Raio maximo que a explosao alcanca, em pixels. Mata todo inimigo e
# apaga toda bala (sua ou inimiga) que ela tocar.
# Bonus de alcance por nivel do jogador: raio = raioMaximo * (1 + (nivel-1)*bonus)
gptExpansao.bonusPorNivel=0.18
gptExpansao.raioMaximo=240
# Ticks pra crescer de 0 ate o raio maximo (a "onda de choque")
# Quantos ticks de invulnerabilidade a bomba concede. Deve cobrir a
# expansao + sustentacao + fade (26+12+18 = 56), com folga pro jogador se
# reposicionar depois que o efeito passa. Bomba que nao protege nao salva
# ninguem: a tela e limpa e o padrao volta a cuspir bala no frame seguinte.
gptExpansao.ticksInvulneravel=70

gptExpansao.ticksExpansao=26
# Ticks parada no tamanho maximo antes de comecar a sumir
gptExpansao.ticksSustentacao=12
# Ticks pra desaparecer (fade out)
gptExpansao.ticksFade=18
# Velocidade de giro da logo, em radianos por tick
gptExpansao.velocidadeRotacao=0.16
# Dano num CHEFE, aplicado uma vez por explosao. A bomba nao mata chefe:
# deixar matar tornaria qualquer spell card trivial (bastava guardar
# cargas e pular a luta). Como referencia, os spell cards tem 300-460 HP,
# entao 90 tira cerca de 1/4 de um deles.
# BALA APAGADA PELA BOMBA VIRA ITEM.
# E a regra da serie: bombar no meio de uma parede rende alguma coisa,
# entao usar a bomba num momento ruim nao e desperdicio total. Sem isso,
# guardar a bomba pra sempre era sempre a jogada certa.
#
# NAO e um item por bala: uma bomba no RED RECOGNA apaga umas 400, e 400
# itens seria uma chuva que trava a tela e um pulo de nivel de graca.
gptExpansao.balasPorItem=6
gptExpansao.maximoDeItens=28
gptExpansao.danoEmChefe=90.0


# ---------------------------------------------------------------------
# CUTSCENE (a abertura "entrando na faculdade", antes da fase 1)
# ---------------------------------------------------------------------
# Caracteres por tick no efeito maquina de escrever. Maior = texto aparece
# mais rapido. O primeiro Z/ENTER numa linha sempre completa ela na hora,
# entao este numero so afeta quem le sem apertar nada.
cutscene.velocidadeTexto=0.9
# Quanto a foto de fundo e escurecida (0 a 255). Sem isso o texto branco
# some no ceu claro da foto da portaria.
cutscene.escurecimentoFundo=110
# Quanto o retrato caminha por tick ao entrar/sair de foco (0 a 1).
# Menor = deslize mais lento e suave; 1 = teleporte instantaneo.
cutscene.suavidadeRetrato=0.12

# Escurecimento da foto da portaria no menu
menu.escurecimentoFundo=150
# Tamanho do item de XP (simbolo da UNESP), em pixels
item.tamanho=18

# ---------------------------------------------------------------------
# MOEDA DE PESO CUBANO — o dinheiro da lojinha do Perea
# ---------------------------------------------------------------------
# A cada N itens que um inimigo solta, UM vira moeda. E por posicao no
# circulo de drop, nao por sorteio: assim dois inimigos iguais sempre dao
# a mesma renda e da pra planejar a compra. Baixar este numero enriquece
# o jogador e, de quebra, atrasa o nivel (o XP some junto).
moeda.umaMoedaACada=3
moeda.escala=1.05
# Velocidade do giro do disco. So estetica.
moeda.velocidadeDoGiro=0.07


# ---------------------------------------------------------------------
# MUSICA
# ---------------------------------------------------------------------
# O javax.sound.sampled do Java puro so le WAV (nao MP3), por isso a
# trilha fica em audio/*.wav. Toca em loop assim que a FASE comeca
# (nao durante a cutscene) e pausa/retoma junto com o ESC.
musica.ativada=true
# TRILHA FORA DAS LUTAS. Vazio = SILENCIO, e e isso mesmo.
#
# Cada chefe tem tema proprio, e eles entram numa tela sem musica — o que
# faz a entrada valer alguma coisa. Com uma trilha de fase tocando o tempo
# todo, o tema do chefe virava so "outra musica" e a virada nao existia.
# Pra voltar a ter musica de fase, e so apontar pra um .wav aqui.
musica.arquivo=
# TRILHA DO ESTAGIO 1 (o caminho da portaria ate a Adriana).
#
# Ela e pedida pelo proprio estagio, igual ao tema de cada chefe. Ficar so
# no musica.arquivo acima nao serve mais: aquela chave hoje quer dizer
# "musica entre as lutas", e esta vazia.
fase1.musica=audio/fase1.wav
# 0.0 (mudo) a 1.0 (volume original do arquivo)
#
# Subiu de 0.6 pra 0.8 junto com a queda dos efeitos: as tres trilhas tem
# volume medio parecido com o de um tiro do jogo, e com os efeitos altos
# elas viravam fundo. Agora a musica e a camada de cima.
musica.volume=0.8

# --- efeitos sonoros (tiros) ---
som.ativado=true
# Volume dos efeitos. Baixo de proposito: o jogador atira ~12x por segundo,
# e som alto nessa cadencia abafa a musica e cansa em poucos segundos.
#
# Caiu de 0.35 pra 0.18 (metade, ~-6 dB) pra musica poder ser ouvida. O que
# se perdeu com isso — os sons raros e importantes ficarem baixos demais —
# esta compensado um por um na tabela de ganhos logo abaixo.
som.volume=0.18

# --- GANHO POR SOM (multiplica o som.volume acima) ---
#
# A chave e "som.ganho." + o nome do arquivo SEM a extensao. Sem linha
# aqui, o ganho e 1.0 e o som toca no volume geral.
#
# Existe porque um numero unico nao serve pra um jogo que tem, ao mesmo
# tempo, som que toca 12x por segundo e som que toca uma vez por luta. O
# teto real e 1.0 no total (volume x ganho): o controle do Java so ATENUA,
# nunca amplifica alem do proprio arquivo.

# A VOZ DO CLAYTON: o som mais alto do jogo, e por bastante.
# 0.18 x 5.0 = 0.9 (contra 0.18 dos outros): uns +14 dB. Alem disso o
# proprio wav foi recomprimido pra ficar mais encorpado — ele era uma
# gravacao de voz, com picos altos e corpo fraco, e "no talo" ainda soava
# mais baixo que um tiro. Numeros: volume medio do trecho falado subiu de
# 0.20 pra 0.37 mantendo o pico em 0.97.
som.ganho.latex_voz=5.0

# Os que tocam o tempo todo: abaixados AINDA MAIS que o geral.
# O se_focusin entrou nesta lista depois de medir: ele era o 8o som mais
# alto do jogo e toca toda vez que se aperta o SHIFT, ou seja, o tempo
# inteiro numa esquiva apertada.
som.ganho.se_plst00=0.7
som.ganho.se_msl=0.7
som.ganho.se_tan00=0.7
som.ganho.se_graze=0.8
som.ganho.se_focusin=0.6

# Os que tocam pouco e precisam ser ouvidos: levantados.
som.ganho.se_cat00=1.7
som.ganho.se_cardget=1.8
som.ganho.se_enep01=1.5
som.ganho.se_pldead00=1.6
som.ganho.se_playerdead=1.7
som.ganho.se_powerup=1.4

# As vozes de cutscene sao bleeps curtinhos e finos; no volume geral novo
# elas praticamente sumiam por tras do texto aparecendo.
som.ganho.voz_estudante=1.5
som.ganho.voz_adriana=1.5
som.ganho.voz_clayton=1.5
som.ganho.voz_santo_java=1.5
som.ganho.voz_narrador=1.5
som.ganho.voz_papa=1.5
# Quantas copias de cada som ficam carregadas. Um Clip so toca uma vez por
# vez, entao com poucas vozes os tiros rapidos sairiam mudos.
# Copias abertas de CADA efeito (pra o mesmo som poder se sobrepor).
som.vozes=3

# TETO de Clips abertos somando todos os efeitos.
# Isto existe por um bug real: o jogo tem mais de 30 efeitos e a placa de
# som aceita um numero limitado de linhas. Passando desse numero, TODO som
# carregado depois falhava — e como o graze so carrega quando voce roça a
# primeira bala, ele nunca tocava. Agora o Som despeja o efeito usado ha
# mais tempo pra abrir espaco (ele recarrega sozinho se voltar a tocar).
som.maximoDeClips=48


# ---------------------------------------------------------------------
# DEBUG - liga/desliga ajudas visuais e codigo de teste
# ---------------------------------------------------------------------
# Mostra no topo do campo qual onda e qual padrao estao rolando
# Pula direto pra fase ao clicar "Jogar", sem passar pela cutscene.
# Ligue enquanto estiver testando jogabilidade.
# MODO DEBUG (tecla F3 liga/desliga em jogo): mostra FPS, hitbox dos
# inimigos, info da onda, e libera o F2 (pular estagio).
# Deixe false pra apresentar.
debug.modoDebug=false

debug.pularCutscenes=false
# Codigo de teste antigo: balas vindas dos 4 cantos a cada tiro
debug.balasDosCantos=false
# Codigo de teste antigo: chuva de itens no meio da tela
debug.pontosDeTeste=false

# ---------------------------------------------------------------------
# CLAYTON - segundo chefe (Roteiro.txt linhas 41 a 57)
# ---------------------------------------------------------------------
clayton.sprite=sprites/bosses/clayton-base.png
clayton.spriteMaligno=sprites/bosses/Clayton-Maligno.png
clayton.escalaSprite=2.55
clayton.escalaSpriteMaligna=2.85

# LARGURA do Clayton, so na horizontal. 1.0 = proporcao original do PNG.
# A foto dele e mais alta que larga e, como o enquadramento e quadrado,
# ele saia magro demais. Isto NAO mexe na colisao: o raio continua sendo
# clayton.raio (herdado de chefe.raio) no centro.
clayton.escalaLargura=1.35

# --- Spell 1: Xeque-Mate Sistematico (pecas de xadrez) ---
# As pecas andam em LANCES: deslizam ate a casa, param, e so entao
# escolhem o proximo movimento seguindo as regras da peca.
clayton.xadrez.hp=350
clayton.xadrez.duracao=1900
clayton.xadrez.cadencia=90
clayton.xadrez.pecasPorLevada=5
# Tamanho da "casa" do tabuleiro em pixels (o passo de cada lance)
clayton.xadrez.tamanhoDaCasa=84
clayton.xadrez.velocidade=4.2
# Pausa entre lances. E a janela em que o jogador LE pra onde a peca vai.
# Diminuir isso deixa o padrao bem mais dificil de antecipar.
clayton.xadrez.pausaEntreLances=35
# Quantos lances cada peca da antes de sair do tabuleiro
clayton.xadrez.lancesPorPeca=7
# Vies de avanco: chance de um lance vertical ir pra BAIXO em vez de pra
# cima. Sem isso as pecas ficavam vagando no topo, coladas no Clayton.
clayton.xadrez.viesParaBaixo=0.80
clayton.xadrez.raio=17

# --- Spell 2: Claytonlings (minions covardes) + criaturas do anticodigo ---
clayton.claytonlings.hp=320
clayton.claytonlings.duracao=2000

# MENOS CLAYTONLINGS. Era 4 a cada 80 ticks com teto de 20 na tela, e isso
# nao era dificil — era impossivel. Com muitos deles o ataque tinha UMA
# resposta certa (correr sem parar) e ela ia ficando menos viavel a cada
# leva, ate nao existir mais saida nenhuma.
#
# Agora sao 2 a cada 140 ticks com teto de 7. O que entrou no lugar sao as
# criaturas do anticodigo, logo abaixo — e elas pedem a postura OPOSTA.
clayton.claytonlings.cadencia=140
clayton.claytonlings.porLevada=2
# Teto de minions vivos: sem isso, jogador que nao desvia acumula parede
clayton.claytonlings.limiteNaTela=7

# --- as criaturas do anticodigo dentro deste spell card ---
# De quantos em quantos ticks nasce uma, e quantas podem existir juntas.
# Duas ja cobrem as duas paredes; a terceira so faria bola cair sem pausa.
clayton.anticodigo.cadencia=260
clayton.anticodigo.limiteNaTela=2
# Faixa de altura (relativa ao campo) onde elas encostam na parede.
# Nem colada no topo (a bola cairia quase reta, sem arco) nem embaixo (o
# arco nao teria altura pra subir antes de cair).
clayton.anticodigo.faixaTopoRelY=0.22
clayton.anticodigo.faixaBaixoRelY=0.48

# HP de cada claytonling.
#
# Era 18.7 e estava absurdo. A CONTA: o leque cheio sao 4 balas de 1 de
# dano a cada 5 ticks, ou seja 0,8 de dano por tick com TUDO acertando o
# mesmo alvo. 18.7 = 23 ticks de fogo concentrado num unico minion — com
# quatro deles em cena e mais quatro chegando a cada 80 ticks, matar era
# matematicamente impossivel e a unica jogada virava fugir.
#
# 7.0 = ~9 ticks de fogo. Continua mais duro que o inimigo comum da fase
# (6.0), o que faz sentido pra minion de chefe, mas agora atirar neles e
# uma resposta viavel em vez de perda de tempo. O corpo dele continua
# sendo o ataque; o que mudou e ele poder ser derrubado no caminho.
clayton.claytonling.hp=7.0
clayton.claytonling.raio=20
clayton.claytonling.velocidade=2.2
clayton.claytonling.velocidadeFuga=8.5
# --- INVESTIDA (o que torna o desvio possivel) ---
# A esta distancia ele TRAVA a rota e parte reto, sem corrigir mais.
# Antes ele corrigia a cada tick e, sendo mais rapido que o jogador,
# nao existia desvio — era so questao de tempo ate encostar.
# Maior = trava mais longe = mais facil desviar.
clayton.claytonling.raioDeInvestida=190.0
# Velocidade durante a investida travada (mais rapida que a aproximacao)
clayton.claytonling.velocidadeInvestida=6.2
clayton.claytonling.sprite=sprites/bosses/clayton-base.png
clayton.claytonling.escalaSprite=2.4
clayton.claytonling.pontos=120
clayton.claytonling.itens=2
# So considera "fui desviado" depois de ter chegado a esta distancia.
# Sem isso ele fugiria logo no inicio, quando a distancia ainda oscila.
clayton.claytonling.raioDeAproximacao=90.0
# Quanto a distancia precisa CRESCER, alem do minimo ja atingido, pra ele
# desistir. Maior = mais teimoso (exige desvio mais claro).
clayton.claytonling.folgaDeDesvio=30.0
# Se perseguir tempo demais sem encostar, desiste do mesmo jeito
clayton.claytonling.ticksAteDesistir=300

# --- Spell 3 (FINAL): LATEX ---
# Um artigo em LaTeX desce pela tela. As LETRAS machucam, os espacos entre
# palavras e as entrelinhas sao seguros. A colisao e feita por MASCARA:
# o texto e rasterizado uma vez numa imagem e o jogo consulta o alpha do
# pixel sob o jogador — a hitbox e o proprio desenho, letra por letra.
clayton.latex.hp=500
clayton.latex.duracao=2600
# Pixels por tick que a pagina desce. Maior = menos tempo pra achar a brecha.
clayton.latex.velocidade=1.15
# Tamanho da fonte e espacamento. Fonte MAIOR = letras mais grossas, mas
# tambem espacos maiores; alturaLinha maior = mais entrelinha pra escapar.
# Fonte em NEGRITO (ver LatexSpell), pra parede de texto ficar solida.
# Em negrito cabem ~42 caracteres por linha nos 600px do campo — aumentar
# mais que isso faz as linhas do artigo serem cortadas na borda.
clayton.latex.tamanhoFonte=25
# Entrelinha. Maior = corredor horizontal mais largo entre as linhas do
# artigo, entao da pra ESCOLHER por qual linha passar em vez de so achar
# a primeira brecha.
clayton.latex.alturaLinha=48
clayton.latex.margemEsquerda=18
# ESPACAMENTO (o que abre os "corredores" no meio do texto):
#   entreLetras   = pixels a mais entre cada letra -> frestas finas
#   extraPalavra  = pixels a mais em cada espaco   -> corredores verticais
# Subir estes valores deixa o ataque MAIS FACIL, mas encurta quantos
# caracteres cabem por linha (com 2 e 7 cabem ~34; acima disso o artigo
# e cortado na borda).
clayton.latex.espacoEntreLetras=2
clayton.latex.espacoExtraPalavra=8
# Recuo da coluna de numeros de linha (o "% 12" alinhado a direita).
# Ela existe pra faixa direita do campo nao virar corredor seguro.
clayton.latex.margemDireita=14
# Espera antes do texto comecar a descer (deixa a voiceline soar)
clayton.latex.ticksDeEspera=100
# Ticks de imunidade depois de encostar na tinta. Sem isso o jogador
# perderia todas as vidas num piscar, ja que o texto e continuo.
clayton.latex.intervaloDeDano=30
# Quanto do raio do jogador conta contra a tinta (0 a 1). As letras
# continuam do mesmo tamanho; o jogador so precisa entrar mais fundo nelas
# pra levar dano.
clayton.latex.fatorHitbox=0.55


# =====================================================
# PAPA — chefe final (Roteiro.txt linhas 58 a 82)
# =====================================================

papa.sprite=sprites/bosses/papa-base.png
papa.escalaSprite=2.55
papa.spriteIA=sprites/bosses/papa-IA_MALIGNA.png

# Tema proprio do chefe final. A fase troca a trilha ao spawnar ele e
# volta pra musica.arquivo quando a luta acaba.
# LEMBRE: javax.sound so le WAV. O .mp3 original foi convertido com
#   ffmpeg -i "flower man.mp3" -ar 22050 -ac 2 -acodec pcm_s16le flower_man.wav
papa.musica=audio/flower_man.wav

# TEMA PROPRIO DA FORMA IA (estagio 7), convertido com:
#   ffmpeg -i black_knife.mp3 -ar 22050 -ac 2 -acodec pcm_s16le black_knife.wav
#
# O PAPA e o unico chefe com duas trilhas, e faz sentido que seja ele: a
# transformacao dele nao e "o mesmo inimigo com sprite novo" como a da
# Adriana e a do Clayton. A tela fica branca, o virus toma o corpo por
# inteiro, e o que sobra e outra coisa — manter a mesma musica dizia o
# contrario disso.
#
# Ela entra depois da cutscene de transformacao e so quando o IEEE solta a
# primeira bala (ver temaDeChefe), entao a virada acontece em silencio e a
# musica nova e a primeira coisa que voce ouve do PAPA IA.
papa.musicaIA=audio/black_knife.wav

# --- temas dos outros dois chefes ---
# Convertidos de mp3 com:
#   ffmpeg -i tema.mp3 -ar 22050 -ac 2 -acodec pcm_s16le tema.wav
# (javax.sound so le WAV — ver o cabecalho de Musica.java)
adriana.musica=audio/kim_jung.wav
clayton.musica=audio/pronounced_rules.wav
papa.escalaSpriteIA=3.0

# --- SPELL 1: Tratado de Proliferacao (bandeiras) ---
# Bandeiras de paises sorteados nascem em leva, GIRAM mirando o jogador e
# depois avancam na direcao travada. O catalogo de paises fica em
# src/Bandeira.java (uma linha por pais).
papa.bandeiras.hp=450
papa.bandeiras.duracao=2000

# Quantas bandeiras por leva, e de quantos em quantos ticks nasce uma leva.
# A leva inteira mira junta: e isso que faz o ataque ser LIDO de uma vez
# em vez de virar um chuvisco de reacoes separadas.
# DOIS LEQUES SE REVEZANDO: cada leva usa METADE do arco (esquerda,
# direita, esquerda...) e vem no DOBRO da frequencia.
#
# Era um leque unico de 6 cobrindo o arco inteiro a cada 64 ticks. Um
# leque largo tem uma resposta so — sair pela borda mais proxima — e
# depois sobra tempo ocioso ate a proxima leva. Meia largura pela metade
# do tempo mantem a mesma quantidade de bandeira no ar (8 a cada 68 ticks
# contra 6 a cada 64), mas o jogador nunca fica sem ter o que fazer.
#
# E o lado ALTERNA em vez de sortear: da pra se preparar pro proximo em
# vez de adivinhar de onde vem.
papa.bandeiras.porLeva=4
papa.bandeiras.intervaloEntreLevas=34

# A CADENCIA ACELERA ao longo do ataque, ate esta fracao do intervalo.
#
# 0.5 = no fim as levas saem no DOBRO da frequencia (34 -> 17 ticks).
#
# Repare que o comeco NAO foi afrouxado pra compensar: o intervalo de
# partida e o mesmo 34 de antes, e a aceleracao so tira tempo dali pra
# frente. Intervalo fixo tinha um problema de forma — o ataque era igual
# no primeiro e no ultimo segundo, entao ou comecava duro demais ou
# terminava facil demais.
papa.bandeiras.fracaoFinalDoIntervalo=0.5

# Quanto tempo ela persegue com o giro antes de travar a direcao,
# e quanto tempo fica travada piscando antes de sair.
# ticksTravada e a JANELA DE FUGA — encurtar isso e o que mais
# aumenta a dificuldade do ataque inteiro. Com 11 ticks o jogador anda
# 44 px andando normal (19 no foco) e precisa de 14 px pra sair da linha:
# da, mas exige reagir, nao passear. NAO desca de ~8 sem testar.
papa.bandeiras.ticksDeMira=34
papa.bandeiras.ticksTravada=11

# Radianos por tick de correcao da mira. Alto demais e ela vira teleguiada
# e andar de lado deixa de funcionar.
papa.bandeiras.taxaDeGiro=0.075

papa.bandeiras.velocidade=7.4
papa.bandeiras.raio=11.0

# Tamanho do pano em relacao a hitbox. Acima de 1 o desenho e maior que a
# colisao — generoso de proposito, ja que a bandeira e um retangulo grande.
papa.bandeiras.escalaSprite=1.9

# Onde a leva nasce: um arco de 'aberturaDoArco' radianos, a
# 'raioDeSpawn' pixels da chefe, sempre virado pra baixo.
papa.bandeiras.raioDeSpawn=170
papa.bandeiras.aberturaDoArco=2.4

# Quanto tempo o nome do pais fica no rodape.
papa.bandeiras.ticksNomeNaTela=90

# Semente do sorteio de paises. >= 0 fixa a sequencia (util pra testar).
papa.bandeiras.seed=-1

# --- SPELL 2: Maquina de Turing (digitacao) ---
# O jogador e TRAVADO dentro de um cabecote sobre a fita e tem que digitar
# o simbolo de cada celula antes do relogio dela zerar.
papa.turing.duracao=999999

# A FITA E UM PROGRAMA DE VERDADE.
#
# Ela era uma sequencia de letras sorteadas — funcionava como jogo, mas
# era mentira: nao havia computacao nenhuma ali. Agora ela e o TRACO DE
# EXECUCAO de uma MaquinaDeTuring real (src/MaquinaDeTuring.java) rodando
# o exemplo canonico de qualquer curso de computacao teorica: o
# reconhecedor da linguagem 0^n 1^n.
#
# Cada celula que voce digita e um simbolo que a maquina de fato escreveu,
# na ordem em que escreveu. O estado dela (q0..q3) aparece no rodape
# mudando conforme a fita anda.
#
# O HP E O TAMANHO DA COMPUTACAO, calculado do proprio traco — nao ha mais
# chave papa.turing.hp nem tamanhoDaFita. Com o tiro desligado, digitar e a
# unica fonte de dano, entao os dois TINHAM que bater; deixar os dois
# soltos era convite pro ataque nunca acabar (HP a mais) ou acabar no meio
# do programa (HP a menos).
#
# n = quantos zeros e quantos uns tem a entrada. O custo cresce rapido:
#   n=3 -> 25 passos    n=5 -> 61 passos
#   n=4 -> 41 passos    n=6 -> 85 passos
# Com n=4 sao 41 passos e HP 410: uns 65 segundos, contra os ~100 da fita
# sorteada de 64 celulas, que era longa demais.
papa.turing.n=4

# Simbolos possiveis. NAO inclua C, V, X nem Z: sao teclas de acao (foco,
# bomba, tiro) e o jogador nao conseguiria digita-las sem efeito colateral.
papa.turing.alfabeto=01ABDEFGHIJKLMNOPQRSTUWY


# Relogio da primeira celula, quanto ele encurta a cada celula resolvida,
# e o piso. 130 ticks = ~2,2 segundos por letra no comeco.
papa.turing.tempoInicial=160
papa.turing.aceleracao=3.5
papa.turing.tempoMinimo=55

# Dano no PAPA por simbolo certo. Durante este ataque o TIRO E A BOMBA
# ficam desligados, entao digitar e a UNICA fonte de dano — e por isso
# tamanhoDaFita * danoPorAcerto tem que dar exatamente o hp acima
# (64 * 10 = 640). Se mexer num, mexa nos tres, senao o ataque ou acaba
# antes da fita terminar ou nao acaba nunca.
# A duracao e enorme pelo mesmo motivo: o unico jeito de sair daqui e
# terminando o programa.
papa.turing.danoPorAcerto=10

# Aparencia da fita.
papa.turing.larguraCelula=62
papa.turing.alturaRelY=0.62

# Quanto o cabecote (e o jogador dentro dele) fica ACIMA da celula.
# Antes ele ficava EM CIMA do simbolo e o retrato cobria justamente a
# letra que era pra ser lida. Precisa ser maior que meia celula + meio
# retrato; com celula de 62 e retrato de 62, 78 da a folga.
papa.turing.alturaDoCabecote=78


# --- SPELL 3: Optimum Path Forest (forma IA) ---
# Prototipos competem pelas amostras com custo fmax; cada aresta vencedora
# vira um feixe de balas. O no do jogador e o indice 0 — quando a floresta
# chega nele, a arvore que o conquistou dispara o veredito.
papa.opf.hp=600
papa.opf.duracao=2600

# Quantas raizes e quantas amostras. MAIS prototipos = mais arvores e
# feixes vindo de mais direcoes; mais amostras = ciclo mais longo.
papa.opf.prototipos=3
papa.opf.amostras=9

# --- O AQUECIMENTO ---
# O classificador nao comeca pronto: ele TREINA. Cada par abaixo vai do
# valor do COMECO (lento) ao do FIM (rapido), interpolado ao longo de
# ticksDeAquecimento. Ao mesmo tempo, os alunos que entram em arco pelas
# laterais vao ficando raros — os dois lados trocam de lugar.
#
# No comeco o problema e o CAMPO (gente entrando pelos lados o tempo todo,
# maquina lenta no fundo); no fim o problema e a MAQUINA (floresta
# fechando rapido, campo vazio em volta).
papa.opf.ticksDeAquecimento=1500

# Quanto a aresta candidata fica PISCANDO antes de virar bala. E a leitura
# do ataque inteiro; o valor final (22) e o piso do que da pra reagir.
papa.opf.ticksDeAvisoInicial=62
papa.opf.ticksDeAvisoFinal=22

# A respirada depois de cada disparo.
papa.opf.ticksEntreConquistasInicial=40
papa.opf.ticksEntreConquistasFinal=10

# Pausa quando a floresta fecha (nao ramifica: e onde o jogador respira).
papa.opf.ticksDeAlivio=120

# --- ALUNOS EM ARCO PELAS LATERAIS ---
# Sao os mesmos ArcEnemy do estagio 1. Reaproveitar o inimigo comum aqui e
# proposital: a ultima luta fecha o circulo mostrando de novo o que o
# jogador enfrentou no primeiro estagio, agora como pano de fundo.
# Entram alternando o lado, um a cada N ticks — constante no comeco, raro
# no fim.
# Entram em LEVADAS de N (alternando o lado), a cada intervalo. Com um de
# cada vez a luta final tinha menos gente na tela que o estagio 1 — nao
# combinava com ser a ultima. A dispersao espalha as alturas dentro da
# levada: com a mesma altura, dois entrando pelos lados opostos desenham
# o mesmo arco espelhado e o jogador le a levada como um objeto so.
papa.opf.arcosPorLevada=2
papa.opf.dispersaoDosArcos=0.16

papa.opf.intervaloDosArcosInicial=46
papa.opf.intervaloDosArcosFinal=520
papa.opf.alturaDosArcos=0.55

# A partir deste aquecimento eles PARAM de vir. Um aluno solitario a cada
# nove segundos nao acrescenta nada e ainda rouba atencao da floresta, que
# a essa altura ja e o assunto da luta.
papa.opf.aquecimentoQueCortaArcos=0.92

# O feixe de cada aresta: quantas balas, velocidade, raio e o espaco entre
# elas. As balas nascem escalonadas PRA TRAS da origem, entao o feixe
# entra como uma linha se estendendo.
papa.opf.balasPorAresta=10
papa.opf.velocidadeBala=2.6
papa.opf.raioBala=6.0
papa.opf.espacamentoNoFeixe=15

# O leque MIRADO que toda amostra conquistada cospe no jogador. E o que
# impede o ataque de ser passado parado — sem ele os feixes seguem a
# geometria do grafo e quase nunca acertam quem nao se mexe.
papa.opf.balasDoNo=5
papa.opf.aberturaDoNo=0.55
papa.opf.velocidadeDoNo=3.4

# O veredito: o leque grande que sai quando o no do JOGADOR e
# classificado. Acontece uma vez por ciclo e e o clima do ataque.
papa.opf.balasDoVeredito=15
papa.opf.aberturaDoVeredito=1.3

# Distancia minima dos nos ate a borda do campo.
papa.opf.margem=60

# Ticks de uma passada completa da linha de varredura (o "scan" que desce
# a tela). So clima — nao afeta jogabilidade. Menor = varre mais rapido.
papa.opf.periodoDaVarredura=210

# --- o codigo do OPF rolando no fundo ---
# Nao e texto decorativo: e o algoritmo de treino do classificador (estilo
# LibOPF, de Papa & Falcao) — selecao de prototipos pela MST, a IFT com
# custo fmax e a classificacao. E o mesmo que rodarOPF() faz.
#
# ALPHA BAIXO E OBRIGATORIO. Bullet hell nao perdoa fundo que compete com
# bala: se o jogador precisar de meio segundo a mais pra achar um projetil,
# o enfeite passou do ponto. Acima de ~60 comeca a atrapalhar.
papa.opf.alphaDoCodigo=48
papa.opf.alphaDoComentario=36

# Pixels por tick que o texto sobe, e a altura de cada linha.
# A rolagem e em PIXELS e nao em linhas: de linha em linha daria saltos, e
# o movimento brusco chamaria atencao pro fundo.
papa.opf.velocidadeDoCodigo=0.35
papa.opf.alturaDaLinhaDoCodigo=14

# Semente das amostras. >= 0 gera sempre a mesma floresta.
papa.opf.seed=-42


# =====================================================
# MORTE — as tralhas que voam do estudante (Destroco.java)
# =====================================================
# Em Touhou o personagem explode numa chuva de particulas ao morrer. Isso
# nao e enfeite: no meio de uma parede de bala, uma morte silenciosa passa
# despercebida e o jogador leva segundos pra entender que perdeu.
# Os sprites ficam em sprites/GFX/destrocos/ — pra acrescentar um objeto
# novo, ponha o PNG la e adicione o caminho no vetor SPRITES da classe.

# Quantas tralhas voam por morte.
morte.quantidadeDeDestrocos=10

# Empurrao inicial (px/tick). Elas saem num leque PRA CIMA e caem depois:
# sortear em 360 graus mandaria metade direto pro chao e mataria o arco.
morte.forcaMinima=2.2
morte.forcaMaxima=5.4

# Gravidade que traz tudo de volta. Maior = arco mais curto e pesado.
morte.gravidade=0.22

# Giro proprio de cada objeto, em radianos por tick (sorteado em +-metade).
morte.giroMaximo=0.26

# Quanto tempo elas duram. Somem no ultimo terco, nao a vida toda: assim
# ficam solidas enquanto o olho ainda esta procurando o que aconteceu.
morte.ticksDeVida=110

# Tamanho dos sprites. 1.0 = o tamanho original do PNG.
morte.escalaDosDestrocos=1.15


# =====================================================
# CONTINUE — a tela que aparece quando as vidas acabam
# =====================================================
# "Você deseja continuar jogando, sabendo que não conseguiu derrotar o
# jogo normalmente?" Aceitar devolve vidas e solta os simbolos dourados
# de FULL, que dao os poderes no maximo.
#
# NAO existe punicao mecanica por continuar — a punicao e o REGISTRO: o
# Main conta quantos continues foram usados e a tela de vitoria muda de
# "FASE LIMPA" pra "FIM (COM CONTINUE)". Quem quiser o final limpo tem
# que recomecar. Punir com dificuldade extra so faria quem ja estava
# perdendo perder mais.

# Vidas e bombas devolvidas ao aceitar.
continue.vidas=4
continue.bombas=3

# Janela de invulnerabilidade ao renascer. O jogador volta EXATAMENTE
# onde morreu, entao sem essa folga a mesma bala o mataria de novo no
# primeiro frame. 180 ticks = 3 segundos.
continue.ticksInvulneravel=180

# Os simbolos dourados da UNESP com "FULL" escrito.
# Eles nascem espalhados numa linha ABAIXO do jogador e SOBEM. Nao vem
# atras dele — e ele que tem que ir atras, subindo o campo enquanto
# desvia. O poder maximo continua sendo a recompensa por continuar, mas
# nao cai no colo. Nem o Point of Collection puxa um FULL.
continue.simbolosFull=6
continue.escalaDoItemFull=1.8

# Onde nascem: espalhados nesta largura, comecando esta altura ABAIXO do
# jogador. Nascer abaixo faz eles PASSAREM por ele subindo, dando uma
# janela pra interceptar cada um em vez de decidir tudo de uma vez.
continue.larguraDoLeque=320
continue.alturaDeSaida=90

# Quao rapido sobem. Mais rapido = menos tempo pra alcancar.
continue.velocidadeDeSubida=1.6

# Bamboleio horizontal enquanto sobem, pra a subida nao ser uma linha
# reta previsivel (o que tornaria a captura trivial).
continue.amplitudeDoBamboleio=0.9
continue.frequenciaDoBamboleio=0.06

# Raio de captura. Generoso de proposito: o simbolo esta subindo e o
# jogador esta desviando de bala ao mesmo tempo — exigir precisao de
# pixel aqui seria crueldade, nao desafio.
continue.raioDeCaptura=26

# Bombas que o item FULL garante (ele so SOBE, nunca tira).
continue.bombasCheias=3


# =====================================================
# INIMIGOS NOVOS DO ESTAGIO 1
# =====================================================

# --- DISQUETE INFECTADO ---
# O vetor do virus (Roteiro.txt linha 5: "leitura disquetonica"), agora
# boiando pelo campus. Desce QUICANDO nas laterais e cospe um leque a cada
# batida. E o kedama da serie: existe pra quebrar o ritmo de uma fase que
# so tem inimigo descendo em coluna.
#
# O tiro sai NO QUIQUE e nao num relogio proprio — assim da pra prever o
# disparo olhando a trajetoria, e um inimigo erratico vira legivel.
inimigo.disquete.hp=9.0
inimigo.disquete.raio=13.0
inimigo.disquete.sprite=sprites/enemies/disquete_inimigo.png
inimigo.disquete.escalaSprite=2.2

# Velocidades. A horizontal e MAIOR que a vertical de proposito: e o que
# faz ele atravessar a tela em diagonal varias vezes antes de sair.
inimigo.disquete.velocidadeH=2.4
inimigo.disquete.velocidadeV=1.1

# O leque do quique.
inimigo.disquete.balasPorQuique=5
inimigo.disquete.abertura=1.5

# Giro do sprite. So estetico — nao mexe em colisao.
inimigo.disquete.giro=0.035

inimigo.disquete.pontos=200
inimigo.disquete.itens=4

# --- MONITOR DE LABORATORIO POSSUIDO ---
# Desce, PARA no ar, cospe uma espiral e recua. E a fada que "senta" da
# serie. O que ele acrescenta a fase e um ALVO PARADO: os outros padroes
# estao sempre atravessando, entao o jogador nunca precisava escolher
# entre atirar e desviar. Com ele, precisa — e se so desviar, ele vai
# embora sem dar o drop.
inimigo.monitor.hp=26.0
inimigo.monitor.raio=15.0
inimigo.monitor.sprite=sprites/enemies/monitor.png
inimigo.monitor.escalaSprite=2.3

# Onde ele freia (fracao do campo), e as velocidades de entrada e saida.
inimigo.monitor.alturaRelY=0.26
inimigo.monitor.velocidadeDescida=2.2
inimigo.monitor.velocidadeRecuo=3.0

# Quanto tempo fica parado cuspindo.
inimigo.monitor.ticksCuspindo=260

# A ESPIRAL: bracos por disparo, ticks entre disparos e quanto o angulo
# avanca por vez. O passo (0.41 rad) e proposital: sendo incomensuravel
# com a volta completa, os bracos nunca se sobrepoem e sempre existe uma
# brecha andando pela tela. Valores "redondos" como 0.5 ou PI/6 fecham o
# padrao em si mesmo e criam paredes.
inimigo.monitor.bracos=3
inimigo.monitor.cadenciaDaEspiral=9
inimigo.monitor.passo=0.41

inimigo.monitor.velocidadeBala=2.4
inimigo.monitor.raioBala=6.0

inimigo.monitor.pontos=450
inimigo.monitor.itens=6

# --- pesos no sorteio de onda do estagio 1 ---
# A onda inteira usa UM padrao (ver o cabecalho de phase1.java): o jogador
# le a onda de uma vez em vez de encarar padroes embaralhados.
fase1.pesoDisquete=26
fase1.pesoMonitor=14

# Teto de monitores por onda. Eles PARAM no ar; seis espirais fixas ao
# mesmo tempo nao e dificil, e indesviavel.
fase1.maximoDeMonitoresPorOnda=2

# --- ONDAS PROCEDURAIS ---
# Uma onda e montada na hora a partir de 1 a N GRUPOS que rodam AO MESMO
# TEMPO, cada um com padrao, lado e fila proprios. O total de inimigos por
# onda continua saindo da rampa de sempre (inimigosPorOndaInicio -> Fim):
# os grupos so repartem esse total. Ou seja, isto muda a FORMA da onda, nao
# a dificuldade dela.
#
# O numero de grupos cresce com o andamento da fase: as primeiras ondas
# sao quase sempre de um padrao so (o jogador esta aprendendo o que cada
# inimigo faz) e as ultimas chegam a tres.
fase1.maximoDeGruposPorOnda=3

# Atraso maximo (sorteado) com que um grupo entra depois do primeiro.
# Sem isso os tres nascem no mesmo frame e a onda vira um susto unico em
# vez de uma formacao que se desenha ao longo de alguns segundos.
fase1.atrasoMaximoEntreGrupos=70


# =====================================================
# EXPLOSAO DE TRANSFORMACAO (Explosao.java)
# =====================================================
# VERMELHA quando um chefe vira a forma maligna, ROXA quando o estudante
# grita "ESPANDAAAAA". As cores nao sao escolha estetica solta: roxo ja e
# a cor da alma e do Santo Java (poder que vem do jogador) e vermelho ja e
# a cor da corrupcao (balas inimigas, cachorros, formas malignas).

# Duracao do estouro inteiro.
explosao.ticksDeVida=78

# Quantas faiscas saem, e a faixa de velocidade delas.
explosao.faiscas=46
explosao.velocidadeMinima=4.0
explosao.velocidadeMaxima=13.0

# Freio por tick das faiscas. Perto de 1 = elas quase nao param (vira
# chuva de bala); abaixo de 0.85 morrem cedo demais e o estouro encolhe.
explosao.atrito=0.93

# Raio final do anel que abre.
explosao.raioDaOnda=340

# Quanto o campo inteiro e tingido no instante do estouro (0 a 1).
# Cai ao QUADRADO do tempo, entao da o estalo e sai rapido — deixar a tela
# colorida por muito tempo atrapalharia a leitura das balas.
explosao.forcaDoFlash=0.55

# Tamanho relativo de cada uso.
explosao.escalaDoChefe=1.0
explosao.escalaDoJogador=0.8


# =====================================================
# PEREA — a lojinha entre o Clayton e o PAPA
# =====================================================
# Ele abre uma vez, depois do Clayton, e e o unico lugar do jogo onde o
# dinheiro serve pra alguma coisa. Enquanto a loja esta aberta o mundo
# congela (ver Main.abrirLoja).

perea.sprite=sprites/npc/perea.png
perea.tamanhoDoRetrato=150

# --- PRECOS ---
#
# Calibrados contra a renda MEDIDA da partida ate a loja (simulacao de 400
# partidas com as ondas procedurais):
#
#   fase 1 solta ~167 itens  -> 56 moedas
#   os dois chefes soltam 176 -> 59 moedas
#   ----------------------------------------
#   coleta perfeita ............ ~114 moedas
#   coleta realista (~65%) ...... ~74 moedas
#
# A soma de TUDO custa 134, ACIMA da coleta perfeita. Isso e o ponto: a
# loja tem que forcar escolha. Nem o jogador que pega todo item consegue
# levar os dois niveis, a passiva e as duas ferramentas.
#
# Com 74 moedas (o caso comum) da pra levar os dois niveis, OU a passiva
# mais as duas ferramentas — duas construcoes bem diferentes pra luta
# final, que e exatamente o que uma loja de um item so nao daria.
# PRECOS BAIXADOS (eram 22/14/34/24/18, total 134).
# Com o total em 134 contra 74 moedas de coleta realista, sobrava uma
# compra e meia — a loja forcava escolha, mas escolher quase nada nao e
# escolher. Agora o total e 84: da pra montar DUAS coisas de verdade e
# ainda faltar a terceira, que e onde a decisao fica interessante.
perea.preco.nivel=15
# (perea.preco.nivelAumento sumiu: o nivel agora e vendido em PACOTE, um
#  preco unico que leva do nivel atual ate o teto. Vender degrau tinha um
#  efeito perverso — o segundo custava mais que o primeiro, entao quem
#  chegava com pouco comprava metade do poder e ficava sem nada pros
#  itens. 15 pesos pelo maximo deixa a decisao limpa: ou o tiro no talo,
#  ou as ferramentas.)
perea.preco.culturaMaker=20
perea.preco.olhoLaser=15
perea.preco.agricultura=11

# --- CULTURA MAKER (passiva) ---
# Multiplica os pontos que os INIMIGOS dao. Nao mexe em graze nem no bonus
# de captura de spell card: se multiplicasse tudo, uma compra de loja
# viraria o unico fator do placar.
perea.culturaMaker.fator=2.0

# --- OLHO LASER DO PEREA (tecla 1) ---
# Raio que sai do estudante pra cima, trava na primeira hitbox e morde ate
# a carga acabar. So um por vez.
perea.olhoLaser.usosPorCompra=1
# 150 ticks = 2,5 s mordendo. Com 2.2 de dano por tick, sao 330 de dano se
# ficar o tempo todo em cima do alvo — o preco de um spell card inteiro
# de chefe, e por isso ele e o item mais caro depois da passiva.
perea.olhoLaser.duracao=150
perea.olhoLaser.danoPorTick=2.2
# Velocidade com que a ponta avanca ate achar alguem.
perea.olhoLaser.velocidadeDaPonta=34.0
perea.olhoLaser.largura=30.0
# Camadas do feixe: a de fora e clara, a do miolo e escura. Menos de 3 e o
# degrade some e vira uma faixa chapada.
perea.olhoLaser.camadas=5
# De quantos em quantos ticks sai um "BRUTAL", e quanto ele dura.
perea.olhoLaser.intervaloDoBrutal=14
perea.olhoLaser.ticksDoBrutal=40

# --- AGRICULTURA DIGITAL (tecla 2) ---
# Dois drones saem a 45 e 135 graus, acham o chefe e pulverizam. Nao da
# dano NENHUM de proposito — o Olho Laser ja e o item de dano, e se este
# tambem machucasse nao haveria escolha na loja.
perea.agricultura.usosPorCompra=1
perea.agricultura.duracao=600
# Ticks de diagonal antes de sair caçando o chefe. Existe por leitura: sem
# eles, o jogador ve dois pontos verdes atravessando a tela e nao entende
# que sairam DELE.
perea.agricultura.ticksDeSaida=26
perea.agricultura.velocidadeDeSaida=6.0
perea.agricultura.velocidadeDeCaca=4.2
perea.agricultura.distanciaDeTrabalho=70

# A LENTIDAO. O chefe envenenado nao anda devagar: ele RECEBE MENOS TICKS
# (ver BossEnemy.tick). 0.55 = ele roda 55% dos frames, ou seja, quase a
# metade da velocidade em tudo — deriva, cadencia de tiro e ate o relogio
# do spell card.
#
# Efeito colateral proposital: como o relogio do spell card tambem para,
# envenenar DA MAIS TEMPO de spell card. Um veneno que apressasse a luta
# nao seria um veneno.
perea.agricultura.fatorDeLentidao=0.55
# Quanto tempo cada baforada mantem o chefe lento. Renovado todo tick
# enquanto os drones estao trabalhando, entao o efeito acaba sozinho
# alguns ticks depois deles pararem.
perea.agricultura.ticksDeVeneno=30

# TAMANHO DOS DRONES. 1.0 era o original (braco de 9 px) e eles sumiam:
# a nuvem que eles soltam tem raio 16, entao o proprio drone acabava menor
# que uma baforada. O item custa moeda, e o jogador precisa VER o que
# comprou trabalhando.
#
# Tudo no desenho e proporcional a este numero — bracos, corpo e helices.
perea.agricultura.tamanhoDoDrone=2.0

perea.agricultura.intervaloDaBaforada=7
perea.agricultura.velocidadeDaBaforada=2.6
perea.agricultura.raioDaBaforada=16
perea.agricultura.ticksDaBaforada=46


# =====================================================
# CRIATURA DO ANTICODIGO — a que chuta bola de futebol
# =====================================================
# Entra por uma lateral, PARA colada na parede e lanca bolas em ARCO no
# jogador: a bola sobe, perde forca e cai em cima dele.
#
# E o unico projetil do jogo que cobra PREVISAO em vez de reacao — todo o
# resto vai reto ou em espiral, e da pra ler a direcao no instante em que
# nasce. A parabola so revela onde vai cair depois de subir.
anticodigo.hp=34
anticodigo.raio=19
anticodigo.velocidadeDeEntrada=3.4
# Onde ela para, em pixels a partir da parede.
anticodigo.margemDaParede=26

# Ticks entre um chute e o proximo, e o agacho de aviso antes de cada um.
# O aviso nao e enfeite: ataque que cai de cima sem telegrafo e injusto.
anticodigo.cadencia=96
anticodigo.ticksDePreparo=30

# O TEMPO DE VOO E O QUE FAZ O ARCO.
# A velocidade inicial e calculada de tras pra frente a partir dele (ver
# AnticodigoEnemy.chutar): quanto maior, mais alto o arco e mais tempo o
# jogador tem pra sair de baixo. 125 ticks = 2,1 segundos no ar, e a bola
# sobe entre 145 e 212 px antes de despencar — medido. Com os 95 originais
# ela subia so 36 px saindo do alto da faixa, o que na tela nao lia como
# arco nenhum: parecia bala reta meio torta.
#
# CUIDADO: com tempoDeVoo baixo demais a conta devolve dy positivo e a
# bola vai DIRETO no jogador, sem subir — vira uma bala reta lenta, que e
# o oposto do ataque.
anticodigo.tempoDeVoo=125
anticodigo.gravidade=0.16
anticodigo.raioDaBola=11

# Ela vai embora sozinha depois disso (900 = 15 s), mesmo sem morrer.
anticodigo.duracao=900
anticodigo.pontos=250
anticodigo.itens=3


# =====================================================
# PAIOLA — o buff "Programacao Orientada a Objetos"
# =====================================================
# Acende uma aura azul quando alguma bala esta em rota de colisao com o
# jogador dentro do horizonte abaixo. Nao da dano nem vida: e so AVISO.
#
# Numa tela com cem balas, a informacao mais cara e "qual delas e comigo".
# A aura nao diz QUAL — isso resolveria o jogo pelo jogador — ela so diz
# que existe uma, agora.

# 60 ticks = 1 segundo de antecedencia, como pedido.
#
# Aumentar deixa a aura acesa quase o tempo todo numa tela cheia (e aviso
# constante nao e aviso); diminuir demais faz ela acender junto com a
# batida, sem dar tempo de reagir.
paiola.ticksDeAntecedencia=60

# Folga somada aos raios na hora de decidir se a bala "vai acertar".
# Com 0 ela so acenderia pra bala que passa EXATAMENTE no pixel da alma, e
# o jogador nunca entenderia o criterio. 14 px pega tambem a raspada.
paiola.folgaDaAmeaca=14.0

# Tamanho da aura, em pixels.
paiola.raioDaAura=34.0


# --- Claytonlings CHUTADORES e o chutao final ---
# Um a cada N claytonlings tambem lanca bola em arco. Fixo por posicao na
# leva, nao sorteado: da pra aprender "o do meio chuta" em vez de
# redescobrir a cada leva quem faz o que.
# TODO claytonling chuta agora (era 1 a cada 2) e a cadencia do chute caiu
# de 90 pra 60 ticks. MEDIDO: 11,3 -> 35,0 bolas lancadas por luta, ou
# seja 3,1x — com as mortes IGUAIS (18,0 nos dois casos).
#
# A tentativa obvia era subir a leva de 2 pra 3 claytonlings. Ela tambem
# triplicava a bola, mas subia a morte de 18 pra 27: o que mata neste
# ataque e o CORPO do minion, nao a bola. Triplicar o numero de bichos
# triplica o perigo junto; triplicar o CHUTE dos bichos que ja existem
# nao.
clayton.claytonling.umChutadorACada=1
clayton.claytonling.cadenciaDoChute=60
clayton.claytonling.tempoDeVooDoChute=85
clayton.claytonling.gravidadeDoChute=0.18
clayton.claytonling.raioDaBola=9

# A BOLA GIGANTE que fecha o ataque. Ela FURA o padrao: apaga toda bala
# inimiga que encosta nela enquanto atravessa, abrindo um corredor limpo.
#
# Ela vem DO COMECO AO FIM do ataque, em intervalo FIXO. Comecou como um
# chutao unico fechando o spell card, mas funciona melhor como uma batida
# que atravessa o turno inteiro: de tempos em tempos a tela abre um rasgo,
# e o jogador aprende a esperar por ele.
#
# Fixo e nao sorteado porque o valor dela e justamente virar ritmo — da
# pra contar os segundos e organizar a esquiva em volta disso. Sorteada,
# seria so mais uma surpresa num ataque que ja tem surpresa demais.
#
# Com 420 e duracao 2000, saem 5 chutoes por luta.
clayton.bolaGigante.intervalo=420
clayton.bolaGigante.primeiroEm=180
#
# LENTA de proposito: uma bola desse tamanho vindo rapido nao seria
# obstaculo, seria um dado sendo jogado.
clayton.bolaGigante.raio=46
clayton.bolaGigante.velocidade=3.2

# Quanto tempo a pagina do LaTeX fica apagada quando a GPT Expansion
# estoura. A bomba limpa toda BALA, mas o artigo nao e feito de balas e
# continuava descendo com a tela limpa em volta — na pratica a bomba nao
# funcionava naquele ataque.
clayton.latex.ticksApagadaPelaBomba=150


# =====================================================
# PAPA IA — Spell "Seguidores do IEEE"
# =====================================================
# Primeiro ataque depois da transformacao, antes do OPF. Duas coisas ao
# mesmo tempo: um CORREDOR que desce serpenteando (o mar se abrindo) e
# LEQUES de simbolos do IEEE saindo retos das duas laterais.
#
# E o unico ataque do jogo em que as duas ameacas pedem coisas OPOSTAS ao
# mesmo tempo: fugir do leque e andar pro lado, que e exatamente o que
# tira voce do corredor. Por isso ele e curto — cansaria rapido.
papa.ieee.hp=620
papa.ieee.duracao=1900
papa.ieee.ticksDoAnuncio=140
papa.ieee.seed=-1

# --- o corredor ---
# Uma "fatia" (linha horizontal de balas com um buraco) a cada N ticks.
# Como todas descem juntas, o que aparece e uma parede continua com um
# caminho por dentro — cortina de agua feita de gotas.
papa.ieee.cadenciaDoCorredor=18
papa.ieee.velocidadeDoCorredor=3.2
papa.ieee.espacamentoNaParede=32
papa.ieee.raioDaParede=7

# LARGURA DO CORREDOR. 150 px com a hitbox de 2 px e generoso de
# proposito: a dificuldade e ACOMPANHAR a abertura enquanto os leques
# empurram voce pra fora dela, nao caber nela.
#
# TODOS OS NUMEROS DESTE BLOCO SAIRAM DE MEDICAO, nao de chute. A primeira
# versao (fatia a cada 7 ticks, parede a 2.5 px/tick) deixava 836 BALAS na
# tela ao mesmo tempo e matava o bot esquivador 18 vezes em 13 segundos —
# era parede, nao corredor. Espacando as fatias e acelerando a descida, o
# pico caiu pra 272 balas e as mortes pra ZERO, sem o ataque perder nada
# do visual: sao praticamente as mesmas balas, so que menos empilhadas.
papa.ieee.larguraDoCorredor=195
papa.ieee.amplitudeDoSerpenteio=80
papa.ieee.velocidadeDoSerpenteio=0.010

# --- os leques laterais ---
papa.ieee.cadenciaDoLeque=125
papa.ieee.balasPorLeque=4
papa.ieee.aberturaDoLeque=0.50
papa.ieee.velocidadeDoLeque=3.2
papa.ieee.raioDoSimbolo=8
# A bala do leque e SO O SIMBOLO do IEEE (a seta com a orbita), recortado
# de dentro do losango. Com o losango inteiro a bala ficava um bloco
# pesado na tela; o simbolo sozinho e legivel no mesmo tamanho e nao
# esconde o que esta atras dele.
papa.ieee.sprite=sprites/GFX/ieee.png

# A parede do corredor sao os PROPRIOS CULTISTAS, e eles DESCEM ANDANDO.
# Recolorido pro azul do logo (#00629B), com os detalhes dourados virando
# branco — a paleta do IEEE e azul e branco.
#
# Este e um PREFIXO: o jogo procura seguidor_ieee_0.png ate _5.png, que
# sao os quadros do ciclo de caminhada.
papa.ieee.spriteDoSeguidor=sprites/GFX/seguidor_ieee
papa.ieee.escalaDoSeguidor=2.6

# CADA CULTISTA ANDA NO SEU PROPRIO RITMO. Sao tres sorteios por cultista:
# o quadro em que ele comeca, a VELOCIDADE do passo dele (este valor
# +-25%) e a fase do gingado.
#
# So sortear o quadro inicial nao bastava: com todos avancando no mesmo
# ritmo eles ficam desalinhados mas EM COMPASSO, e o olho percebe o
# compasso. Variando a velocidade, as fases escorregam uma em relacao a
# outra o tempo todo e nunca formam padrao.
papa.ieee.ticksPorQuadro=7.0

# O gingado horizontal. PEQUENO de proposito: 12 px contra um corredor de
# 150. Ele existe pra a fileira nao parecer uma regua — se fosse grande, o
# corredor mudaria de largura sozinho e o jogador seria punido por uma
# coisa que nao tinha como prever.
papa.ieee.amplitudeDoGingado=12.0
papa.ieee.frequenciaDoGingado=0.055

# ELES ANDAM PRO LADO DE FORA, ABRINDO O CAMINHO.
# Quem nasce a esquerda do corredor anda pra esquerda, quem nasce a
# direita anda pra direita — sao as duas fileiras se afastando que ABREM a
# passagem, em vez de ela ser um buraco que ja veio pronto.
#
# O afastamento e limitado: sem teto, as fileiras se afastariam pra sempre
# e a parede se desfaria nas bordas. Com o teto, elas dao alguns passos e
# ficam — o mar abre e para aberto.
papa.ieee.velocidadeDeAfastamento=0.22
papa.ieee.afastamentoMaximo=34.0
# Faixa de altura (relativa) onde os leques nascem. Sorteada e nao fixa:
# com altura fixa o jogador ficava sempre abaixo dela e o ataque sumia.
papa.ieee.faixaTopoRelY=0.15
papa.ieee.faixaBaixoRelY=0.55


# =====================================================
# PAPA IA — Spell "RED RECOGNA" (o sol)
# =====================================================
# Entre os Seguidores do IEEE e o OPF. Um simbolo cresce brilhando no meio
# do campo e cospe anel atras de anel de bala vermelha, girando devagar.
papa.recogna.hp=900
papa.recogna.duracao=2400
# Onde o sol fica (altura relativa ao campo). Ele NAO segue o chefe: com o
# centro andando, aneis de levas diferentes se cruzam e os corredores
# fecham sozinhos em lugares imprevisiveis — foi o defeito que as Somas de
# Riemann da Adriana tiveram, e a correcao la foi a mesma.
papa.recogna.alturaRelY=0.34

# --- os aneis ---
papa.recogna.balasPorAnel=17
papa.recogna.intervaloEntreAneis=14

# O PASSO ANGULAR E O ATAQUE INTEIRO.
#
# Cada anel nasce girado este tanto em relacao ao anterior. Se o passo
# fosse uma fracao exata da volta (2*PI/12, por exemplo), os aneis se
# alinhariam a cada 12 levas e o campo viraria 12 corredores retos e
# permanentes — trivial de passar.
#
# 2.39996 e o ANGULO AUREO, o mesmo que o girassol usa pra empacotar
# semente sem sobrepor nenhuma: e literalmente o arranjo mais
# anti-alinhamento que existe. Dois aneis nunca coincidem, os vaos
# escorregam continuamente, e nao da pra decorar posicao.
papa.recogna.passoAngular=2.39996

# BALAS LENTAS E GRANDES, como no original. Bala rapida cobra reacao; bala
# lenta e grande cobra PLANEJAMENTO — voce ve a parede se formando e
# escolhe com antecedencia por qual fresta vai sair.
#
# MEDIDO, com o bot esquivador (15 s cada):
#   26 balas / 9 ticks / vel 1.35 ... 1 morte, 723 balas na tela
#   22 balas / 11 ticks / vel 1.6 ... 0 mortes, 433 balas   <- este
#   18 balas / 13 ticks / vel 1.8 ... 3 mortes, 271 balas
#
# Repare na ultima linha: MENOS bala e MAIS morte. Acelerar a bala pra
# aliviar o numero na tela piora o ataque, porque tira justamente o tempo
# de planejar que e a alma dele. Quem quiser afrouxar, afrouxe pelo
# numero de balas por anel — nunca pela velocidade.
papa.recogna.velocidadeDaBala=1.6
papa.recogna.raioDaBala=8.0
# De onde elas nascem, medido do centro. Nascem na BORDA do sol: nascendo
# no meio, passariam por baixo do desenho e apareceriam do nada.
papa.recogna.raioDeNascimento=70

# --- o simbolo ---
papa.recogna.raioDoSimbolo=130
papa.recogna.ticksParaCrescer=420
papa.recogna.velocidadeDoGiro=0.011
# Nos do grafo desenhado dentro do sol. E a floresta de caminhos otimos do
# proprio PAPA vista de cima — o ataque seguinte e essa figura virando
# mecanica.
papa.recogna.nosDoSimbolo=8

# --- O SOL QUEIMA QUEM ENCOSTA ---
# Sem isto o ataque tinha um buraco enorme: as balas nascem na BORDA do
# simbolo e vao pra fora, entao o miolo era uma sala segura permanente —
# dava pra sentar em cima da marca e esperar o cronometro zerar.
#
# A area que queima e MENOR que o desenho, porque o desenho tem coroa e
# brilho e cobrar dano pelo brilho seria injusto: o jogador julga
# distancia pelo nucleo, que e a parte solida.
#
# Ela cresce junto com o sol, o que finalmente da sentido mecanico ao
# crescimento: o campo seguro encolhe conforme o ataque avanca.
# O FOGO VAI ATE ONDE AS BALAS NASCEM (+ esta folga), e nao mais uma
# fracao solta do simbolo.
#
# Aqui estava o furo que tornava o ataque trivial, e nao era o padrao: era
# GEOMETRIA. O fogo cobria 47 px do centro e as balas nasciam a partir de
# 70 px indo PRA FORA — sobrava uma ROSQUINHA entre os dois onde nenhuma
# bala passava nunca. Medido: 61 pontos do campo eram 100% seguros por 40
# segundos parado.
#
# Amarrando o fogo ao raioDeNascimento, a rosquinha fecha e SE MANTEM
# fechada: mexer num move o outro junto. Com dois numeros soltos,
# qualquer ajuste futuro reabriria o buraco sem ninguem perceber.
papa.recogna.folgaDoFogo=6
papa.recogna.intervaloDeDano=30

# A marca de verdade do grupo no miolo do sol, VERMELHA em brasa.
#
# O arquivo original e um gradiente azul/roxo; a conversao usa a
# luminancia de cada pixel pra decidir o tom (traco denso vermelho escuro,
# partes claras quase brancas) e PRESERVA o alfa. Tingir com um retangulo
# por cima nao funcionaria: pintaria tambem onde o desenho e transparente
# e a marca viraria um quadrado — o mesmo erro que o item dourado da UNESP
# ja deu uma vez.
#
# Sem o arquivo o ataque cai num "R" desenhado: o jogo nunca depende de um
# PNG estar no lugar certo pra rodar.
papa.recogna.sprite=sprites/GFX/recogna.png
papa.recogna.escalaDaMarca=0.92


# =====================================================
# ASCENSAO — a cerimonia do "ESPANDAAAAA"
# =====================================================
# Energia roxa escorre dos cantos pro estudante, ficando mais densa, ate
# que no clímax da musica a armadura se fecha de uma vez.
ascensao.musica=audio/ascension.wav

# O TEMPO DA ARMADURA E O TEMPO DA MUSICA.
#
# 538 ticks = 8,97 s. Nao foi escolhido no olho: medi o envelope de
# energia do arquivo e esse e o MAIOR salto da faixa inteira. A musica
# constroi, da uma respirada por volta dos 7 s e entao estoura — e ali que
# a armadura fecha.
#
# (A estimativa inicial era 5,5 s. O que existe la e um pico menor; o
# baque de verdade e quase quatro segundos depois.)
#
# Meio segundo de erro aqui nao le como "a musica marcou o momento", le
# como bug de sincronia — o jogador nao sabe dizer por que, so sente que
# ficou errado.
ascensao.tickDoEstouro=538

# Espera antes da energia comecar, pro SANTO JAVA sair do meio da tela.
ascensao.ticksDeAtraso=30

# Quanto a cerimonia dura no total (a faixa tem 16,8 s = ~1010 ticks).
ascensao.duracao=900

# Fiapos de energia por tick NO AUGE. A quantidade real cresce ao
# QUADRADO ate o estouro: linear parecia torneira aberta no mesmo volume o
# tempo todo; ao quadrado, comeca com um fiapo aqui e ali e termina em
# enxurrada — que e a forma da propria musica.
ascensao.fiaposPorTick=3
ascensao.ticksDoFiapo=46

# Veu roxo sobre o campo, pra os riscos finos de luz aparecerem.
ascensao.veuMaximo=120
ascensao.raioDaAura=90

# --- AS NOTAS: balas brancas de contorno preto, em espiral ---
#
# No lugar das marcas laterais, que estavam miradas no jogador. Juntas com
# os aneis, aquilo ficou impossivel — nao por serem muitas, mas porque as
# duas coisas cobravam a MESMA resposta ao mesmo tempo: sair da linha.
# Voce fugia do anel pro lado e entrava na marca; fugia da marca e voltava
# pro anel. Nao havia jogada certa, so sorte.
#
# As notas obedecem a outra regra: saem do sol numa espiral CONTRARIA a
# dos aneis e vao devagar, entao ATRAVESSAM os corredores em vez de fechar
# eles. O corredor continua servindo; o que elas cobram e nao ficar parado
# dentro dele.
#
# A COR e o resto do truque. Toda bala do jogo e miolo claro com borda
# colorida; a nota e o contrario, branca chapada com contorno PRETO. Numa
# tela inteiramente vermelha, uma bala vermelha a mais vira textura — o
# branco/preto e a unica combinacao que sobrevive ali, porque separa por
# luminancia e nao por matiz.
papa.recogna.intervaloDasNotas=62
papa.recogna.notasPorLeva=3
papa.recogna.velocidadeDasNotas=1.15
# Aceleracao PERPENDICULAR a saida: e ela que encurva a nota e faz o arco.
papa.recogna.curvaturaDasNotas=0.026
# Quanto a leva seguinte gira em relacao a anterior (sentido negativo).
papa.recogna.passoDasNotas=0.55
papa.recogna.raioDaNota=8.5

# Tamanho do CARD DE GPT EXPANSION (a carga de bomba que cada chefe
# derrotado dropa, uma por chefe). Desenhado como CARTA e nao como disco:
# os outros itens sao redondos, e no meio da chuva de drop do chefe a
# silhueta e o que separa "mais um item" de "aquilo ali e outra coisa".
cardGpt.escala=1.9

# --- O SIMBOLO DIGITADO VIRA PROJETIL ---
# Cada letra certa sai da fita, voa num arco ate o PAPA e estoura nele.
#
# O dano ja acontecia — a barra dele descia a cada letra — mas nada LIGAVA
# as duas coisas na tela: voce digitava embaixo e um numero mudava la em
# cima. Sem esse elo, o ataque parecia um minigame parado no meio da luta,
# e nao a luta em si.
#
# O DANO CONTINUA SENDO APLICADO NA HORA DO ACERTO, nao na chegada do
# projetil: atrasar pelo tempo de voo faria a barra descer fora de
# compasso com a digitacao, que e justamente a sincronia que se quer.
papa.turing.ticksDeVooDoSimbolo=16
papa.turing.ticksDoEstouro=14

# Em quantos ticks a cena (veu preto, retratos e caixa de fala) sai da
# frente durante a cerimonia da armadura.
#
# Ela sai porque nao ha texto pra ler naquele momento — a conversa fica
# travada de proposito enquanto a energia junta — e porque o estudante
# fica na faixa de BAIXO do campo, exatamente onde a caixa de fala
# aparece: metade da transformacao acontecia atras dela.
#
# Gradual e nao instantaneo: cortar de um frame pro outro pareceria bug de
# renderizacao, e nao a cena abrindo espaco.
cutscene.ticksParaSairDaFrente=22

# O "V" GIGANTE no canto inferior direito, enquanto a morte esta marcada.
#
# O deathbomb ja existia — ao ser atingido, ainda ha 12 ticks em que
# apertar V cancela a morte —, mas o unico aviso ficava DENTRO do campo,
# em cima do jogador, no meio de uma parede de bala. Ou seja, exatamente
# onde o olho ja esta sobrecarregado e no instante em que ele mais se
# perde.
#
# Agora o aviso fica FORA do campo, num canto que nunca tem nada. A janela
# continua com o mesmo tamanho e a decisao continua sendo do jogador; o
# que muda e ele ficar sabendo que a decisao existe.
#
# Ele so aparece quando a bomba REALMENTE esta disponivel (com armadura e
# com carga): anunciar uma tecla que nao faz nada seria pior que nao
# anunciar nada.
hud.tamanhoDoAvisoV=150
hud.margemDoAvisoV=90

# CARENCIA DA TELA DE CONTINUE: ticks em que ela ignora o teclado.
#
# Voce morre no meio de uma parede de bala, ou seja, com o dedo grudado no
# Z atirando. A tela aparece nesse exato instante e lia o mesmo Z como
# resposta — a escolha mais importante da partida virava um acidente.
#
# 45 ticks = 0,75 s. Tempo de tirar o dedo e ler a pergunta. As teclas sao
# zeradas durante a carencia, senao o Z que ja estava apertado ficaria
# pendurado e seria lido no primeiro frame livre.
continue.ticksDeCarencia=45

# --- CLAYTONLINGS NAS PAREDES (no lugar das criaturas do anticodigo) ---
#
# As criaturas verdes eram um bicho novo so pra esse ataque, com arte e
# regra proprias — muito peso pra uma coisa que aparece uma vez no jogo
# inteiro. E elas nao pareciam ter nada a ver com o Clayton: o spell card
# e sobre ele se MULTIPLICAR, e metade da tela era ocupada por outra
# coisa. Claytonlings chutadores colados na parede fazem o mesmo papel
# (bola caindo de cima, do lado) usando uma peca que o jogador ja conhece.
#
# Quantos nascem de uma vez em CADA parede. Espalhados na vertical: no
# mesmo ponto, os chutes sairiam todos da mesma altura e virariam um so.
clayton.claytonling.porLadoNaParede=3
clayton.claytonling.margemDaParede=40
clayton.claytonling.espacoNaParede=54

# Quantos estouros extras saem quando o RED RECOGNA cai — o fim do jogo.
# Espalhados no ESPACO e disparados juntos: como a Explosao ja dura 78
# ticks, eles se sobrepoem e leem como UM estouro grande e irregular. Um
# so, centralizado, leria como um circulo — bonito e pequeno.
papa.recogna.estourosDoFim=5

# O GRITO DA ASCENSAO, fora da caixa de dialogo.
#
# Caixa de fala e onde se passa INFORMACAO, e essa linha nao e informacao,
# e um grito. Na caixa ela vinha com nome do personagem, letrinha por
# letrinha e um "aperte Z" implicito — o mesmo tratamento de "bão prof, cê
# gostou?". Solta na tela, em corpo enorme, ela e o que e.
#
# Entra e sai RAPIDO: fade lento pareceria legenda, corte curto le como
# impacto. Aparece depois do atraso, junto com os primeiros fiapos — o
# grito e o que CHAMA a energia, entao vir antes inverteria a causa.
ascensao.grito=ESPANDAAAAA!!!!!!!!!
ascensao.tamanhoDoGrito=54
ascensao.gritoEntra=10
ascensao.gritoFica=95
ascensao.gritoSai=22

# =====================================================
# CREDITOS — a foto no uba e o agradecimento
# =====================================================
# "Foto final todos aparecem no uba bebendo" (Roteiro.txt linha 79).
#
# Cinco tempos encadeados: escurece -> abre no RODAPE da foto -> ela sobe
# -> fecha no preto -> "Obrigado por jogar!" com os numeros da partida.
#
# Comeca no rodape e sobe porque a foto e alta e estreita (1086x1448) e
# nao cabe inteira sem encolher a ponto de ninguem reconhecer as caras.
# De brinde faz a coisa certa dramaticamente: comeca no chao (as folhas de
# exercicio, os cachorros) e termina nas pessoas — a ordem em que a
# historia aconteceu.
creditos.foto=sprites/ambient/uba_final.png
creditos.ticksEscurece=60
creditos.ticksAbre=70
creditos.ticksSobe=460
creditos.ticksFecha=70
creditos.ticksObrigado=90

# Velocidade com que o claytonling de parede corre do CLAYTON ate o posto
# dele na lateral. Rapido de proposito: a viagem e so a ligacao visual
# entre o chefe e a lateral, nao um momento de jogo.
clayton.claytonling.velocidadeAtePosto=7.0
