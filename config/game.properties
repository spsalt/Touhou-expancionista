# =====================================================================
#  TOUHOU EXPANCIONISTA - AJUSTES DE JOGABILIDADE
# =====================================================================
#  Mexa nos numeros deste arquivo e rode o jogo de novo (ou aperte F5
#  dentro do jogo) para testar. NAO precisa recompilar nada.
#
#  Se uma chave estiver faltando ou com valor invalido, o jogo usa o
#  valor padrao que esta escrito dentro do codigo e avisa no console.
# =====================================================================


# ---------------------------------------------------------------------
# JANELA
# ---------------------------------------------------------------------
janela.largura=1080
janela.altura=720
janela.fps=60


# ---------------------------------------------------------------------
# CAMPO DE JOGO (a "arena" onde as balas valem, estilo Touhou)
# O resto da janela vira o painel lateral de status.
# ---------------------------------------------------------------------
campo.x=32
campo.y=16
campo.largura=600
campo.altura=688


# ---------------------------------------------------------------------
# JOGADOR
# ---------------------------------------------------------------------
# Posicao inicial em fracao do campo (0.5 = meio, 0.8 = perto do fundo)
jogador.spawnRelX=0.5
jogador.spawnRelY=0.8

jogador.velocidade=4.0
# Velocidade com X segurado (modo foco, para desviar com precisao)
jogador.velocidadeFoco=1.75

# Raio da hitbox real (bolinha verde). Menor = mais facil desviar.
jogador.raioHitbox=2.0
# Raio de coleta automatica de itens (circulo azul)
# --- GRAZE (rocar bala) ---
# Passar a menos de raioGraze da BORDA de uma bala inimiga, sem ser
# atingido, vale pontosPorGraze. Cada bala so conta uma vez.
# E a mecanica que faz valer a pena desviar de perto: sem ela, a jogada
# otima e ficar o mais longe possivel de tudo, o que e chato de jogar.
# Subir o raio deixa o graze mais generoso (e o placar mais inflado).
jogador.raioGraze=26.0
jogador.pontosPorGraze=60

# --- POINT OF COLLECTION ---
# Acima desta altura (fracao do campo, 0 = topo) TODOS os itens vem
# sozinhos pra voce. E a faixa mais perigosa da tela — de onde inimigo e
# bala descem — e a recompensa por subir ate la e nao precisar caçar item.
jogador.alturaColetaTotalRelY=0.22

# --- DEATHBOMB ---
# Frames entre "voce foi atingido" e "voce perdeu a vida". Nessa janela,
# apertar V ainda salva, gastando uma bomba. 12 frames = 1/5 de segundo.
# 0 desliga a janela (morre na hora, como era antes).
jogador.ticksDeathbomb=26

jogador.raioColeta=45.0
# Tamanho do RETRATO em relacao a hitbox. So aparencia — a colisao real
# continua sendo o raioHitbox de cima, entao aumentar isso nao deixa o
# jogo mais dificil, so o personagem mais visivel.
# Retrato do jogador. O expansivo entra quando ele ganha a armadura no
# fim do estagio 1 (o "ESPANDAAAAA" do roteiro, linha 16).
jogador.sprite=sprites/player/estudante.png
jogador.spriteExpansivo=sprites/player/estudante_expansivo.png

# CORRECAO DE ENQUADRAMENTO do sprite expansivo.
# O rosto e o MESMO nos dois PNGs (312x372 px); o expansivo so tem a aura
# desenhada em volta, ocupando ~35% do quadro. Encaixados na mesma caixa,
# o expansivo parecia ter encolhido. Este fator devolve o rosto ao tamanho
# original — a aura extrapola a caixa, que e o que se quer.
# Se voce trocar a arte do expansivo, remeca: fator = lado do PNG / lado do rosto.
jogador.escalaDoExpansivo=1.53
cutscene.escalaDoExpansivo=1.53

# ONDE ESTA O ROSTO dentro do PNG, em fracao da largura/altura.
# O desenho e ancorado pelo centro do ROSTO, e nao pelo centro do arquivo.
# No expansivo o rosto esta a 44,3% da largura (a aura ocupa mais espaco
# de um lado), e ancorar pelo meio da imagem fazia a alma cair no olho
# esquerdo dele em vez do meio da cara.
# Pra remedir numa arte nova: centro do bloco de pixels do rosto / tamanho.
jogador.sprite.centroX=0.5
jogador.sprite.centroY=0.5
jogador.spriteExpansivo.centroX=0.443
jogador.spriteExpansivo.centroY=0.486

# NO FOCO o corpo fica translucido e pulsando entre estes dois valores.
# A alma e um ponto de 2 px no meio de um retrato de 60: com o corpo em
# opacidade cheia ela sumia. Desbotar o corpo poe o olho no unico ponto
# que importa pra desviar.
jogador.opacidadeNoFocoMin=0.30
jogador.opacidadeNoFocoMax=0.62

# Tamanho do HALO da alma, em multiplos do raio da hitbox.
# So o brilho, o anel e as faiscas crescem — o nucleo solido continua
# exatamente do tamanho de jogador.raioHitbox. Se o desenho cheio fosse
# maior que a colisao, o jogador aprenderia a desviar de uma bolinha que
# nao existe e todo ajuste de hitbox viraria mentira.
jogador.escalaDoHaloDaAlma=4.2

# Lado do retrato do jogador, EM PIXELS — nao e multiplicador do raio.
# Antes era escala sobre a hitbox, e por isso cada aperto na hitbox
# (5.0 -> 3.0 -> 2.0) encolhia o personagem junto. Sao duas coisas
# separadas: este numero e decisao de ARTE, jogador.raioHitbox e decisao
# de JOGABILIDADE. Mexer num nao mexe no outro.
jogador.tamanhoSprite=62

jogador.vidas=7
# Cargas da GPT EXPANSION (o ataque especial — ver secao GPT EXPANSAO mais
# abaixo). Chamado de "bombas" aqui no codigo por convencao de bullet hell,
# mas na HUD e no jogo aparece sempre como "GPT Expansion".
jogador.bombas=5

# --- progressao de nivel (cada nivel desbloqueia um TIPO de tiro novo,
#     ver a secao TIPOS DE TIRO DO JOGADOR mais abaixo) ---
# Custo do nivel N = xpBase * fatorXpPorNivel ^ (N-1)
# Com 12 e 2.4:  N2=12  N3=29  N4=69  N5=166  N6=398 itens
# Cada inimigo dropa 2 itens (inimigo.itensAoMorrer).
# BAIXE o xpBase ou o fator pra subir de nivel mais rapido.
jogador.xpBase=8
jogador.fatorXpPorNivel=1.6
# Teto de nivel. E ate onde os tipos de tiro sao desbloqueados.
jogador.nivelMaximo=5

# ATE ONDE OS ITENS LEVAM SOZINHOS. Daqui pra cima, so comprando do Perea.
#
# O jogo nasceu com os itens levando ate o topo, e isso deixava a lojinha
# sem razao de existir: quem jogava bem chegava no PAPA com tudo
# desbloqueado e nenhum motivo pra gastar moeda. Com o teto em 3, os dois
# ultimos niveis (RICOCHETE e leque cheio) viram compra.
#
# Isto NAO endurece o comeco do jogo: os niveis 1 a 3 saem na mesma
# velocidade de sempre, e a fase 1 inteira acontece antes do Perea existir.
jogador.tetoDeNivelPorItem=3
# Ja no teto, cada item pego vira esta quantidade de pontos
# Quantos niveis voce perde ao morrer. Em Touhou o que doi na morte nao e
# a vida perdida, e o Power que vai junto: voce volta atirando menos e
# demora mais pra matar o que te matou. 0 desliga.
jogador.niveisPerdidosAoMorrer=1

jogador.xpEmPontosNoNivelMaximo=50
# Ticks de invencibilidade depois de levar dano. As balas NAO sao mais
# apagadas quando voce apanha — esta janela e toda a protecao pra sair de
# onde estava, entao ela precisa ser generosa (120 = 2 segundos).
jogador.invulnerabilidadeTicks=120

# Tiro automatico ligado ao comecar a partida.
# Em jogo, a tecla C liga/desliga a qualquer momento.
jogador.autofireInicial=true

# Cadencia de tiro em ticks (menor = atira mais rapido)
jogador.cadenciaTiro=5
# Abertura do leque de tiros, em radianos
jogador.aberturaTiro=0.5
jogador.aberturaTiroFoco=0.1
jogador.velocidadeBala=12.0
jogador.raioBala=4.0
jogador.danoBala=1.0


# ---------------------------------------------------------------------
# TIPOS DE TIRO DO JOGADOR
# ---------------------------------------------------------------------
# Cada nivel DESBLOQUEIA um tipo novo, em vez de so somar +1 bala:
#
#   N1  leque
#   N2  leque + PONTEIROS   (teleguiados, fracos, verdes)
#   N3  leque maior + ponteiros
#   N4  + RICOCHETES        (losangos laranjas que quicam nas laterais)
#   N5  tudo, leque cheio
#
# Cada tipo resolve um problema diferente: leque e dano de frente,
# ponteiro caça quem fugiu pro canto, ricochete alcança quem esta colado
# na parede.

# Teto de balas do leque. Baixo de proposito — o poder novo vem dos TIPOS.
tiro.leque.maximo=4

# Sprite da bala normal (capsula ciano). Se o PNG sumir, volta pro circulo.
tiro.leque.sprite=sprites/GFX/bala_leque.png

# --- PONTEIRO (teleguiado) ---
# Em que nivel ele aparece
tiro.ponteiro.nivel=2
tiro.ponteiro.maximo=3
tiro.ponteiro.velocidade=7.5
# Radianos que ele gira por tick. MAIOR = persegue mais agressivo.
# Baixo de proposito: da limite ao teleguiamento, entao alvo rapido escapa
# e a bala nao vira acerto garantido.
tiro.ponteiro.taxaDeGiro=0.10
tiro.ponteiro.raio=4.5
# Dano em fracao do tiro normal. Fraco: o valor dele e a cobertura.
tiro.ponteiro.fatorDano=0.18

# Sprite da teleguiada: SETA verde. Ela e desenhada meio transparente pra
# o jogador ler na hora que aquela bala e a fraca — a forma diz o que ela
# faz (aponta) e a opacidade diz o quanto ela machuca.
tiro.ponteiro.sprite=sprites/GFX/bala_ponteiro.png
tiro.ponteiro.opacidade=0.55

# --- RICOCHETE (quica nas laterais) ---
tiro.ricochete.nivel=4
tiro.ricochete.velocidade=9.0
tiro.ricochete.raio=4.5
tiro.ricochete.fatorDano=0.45
# Angulo de saida em graus (0 = reto pra cima)
tiro.ricochete.anguloGraus=38
# Quantos quiques antes de sumir. Sem esse limite, uma diagonal perfeita
# ficaria presa entre as duas paredes pra sempre.
tiro.ricochete.quiques=3

# Sprite da bala que quica: faisca laranja de 4 pontas.
tiro.ricochete.sprite=sprites/GFX/bala_ricochete.png
# Tamanho do desenho em relacao ao raio de colisao. Menor que as outras
# balas de proposito: ela quica pela tela inteira, entao um sprite grande
# poluia a leitura no meio de um padrao de chefe.
tiro.ricochete.escalaSprite=1.7


# ---------------------------------------------------------------------
# PROJETEIS (geral)
# ---------------------------------------------------------------------
# Margem fora do campo antes da bala ser apagada da memoria.
# Precisa ser > 0 senao balas que nascem na borda somem na hora.
bala.margemSaida=48


# ---------------------------------------------------------------------
# INIMIGOS DE ONDA - valores COMPARTILHADOS pelos tres padroes
# ---------------------------------------------------------------------
inimigo.hp=6.0
# Raio de COLISAO (onde as balas do jogador acertam)
inimigo.raio=10.0
# Tamanho do DESENHO em relacao ao raio. Separado da colisao de proposito:
# da pra deixar o sprite maior sem deixar o inimigo mais facil de acertar.
inimigo.escalaSprite=2.2
inimigo.sprite=sprites/enemies/inimigo.png
# Ticks entre cada tiro (maior = atira menos)
inimigo.cadenciaTiro=50
inimigo.velocidadeBala=3.2
inimigo.raioBala=5.0
inimigo.pontosAoMorrer=100
# Itens de XP dropados por inimigo. Junto com jogador.xpBase, e o que
# controla a velocidade da progressao de nivel.
inimigo.itensAoMorrer=2


# ---------------------------------------------------------------------
# PADRAO PENDULO - desce pelo topo, fica lento no meio, segue e sai
# ---------------------------------------------------------------------
inimigo.pendulo.velocidade=3.2
# Quanto ele desacelera na zona lenta.
#   0    = nao desacelera (cai reto)
#   0.85 = cai pra 15% da velocidade no centro da zona
#   1.0  = para completamente (evite: ele nunca sai da tela)
inimigo.pendulo.lentidaoMaxima=0.85
# Onde fica o centro da zona lenta, em fracao da altura do campo
inimigo.pendulo.zonaLentaRelY=0.45
# Largura da zona lenta em pixels. Maior = freia mais cedo e por mais tempo.
inimigo.pendulo.larguraZonaLenta=110


# ---------------------------------------------------------------------
# PADRAO ARCO - entra pelo lado, curva 90 graus e sai por cima
# ---------------------------------------------------------------------
inimigo.arco.velocidade=3.0
# Raio da curva em pixels. Menor = vira rapido e fecha o arco perto da
# borda; maior = curva aberta que atravessa boa parte da tela.
inimigo.arco.raioDaCurva=170
# Altura em que entram, em fracao da altura do campo.
# Todos da mesma onda usam esta altura (e o que faz virar fila indiana).
inimigo.arco.entradaRelY=0.55


# ---------------------------------------------------------------------
# PADRAO HORIZONTAL - atravessa de um lado da tela ao outro
# ---------------------------------------------------------------------
inimigo.horizontal.velocidade=3.4
# Faixa de alturas da travessia. Os inimigos da onda sao distribuidos
# entre o minimo e o maximo, entao a fila entra na diagonal.
# Deixe os dois iguais pra todos passarem na mesma altura.
inimigo.horizontal.entradaRelYMin=0.10
inimigo.horizontal.entradaRelYMax=0.45
# Balanco senoidal no Y durante a travessia. 0 = linha reta.
inimigo.horizontal.amplitudeOnda=0
inimigo.horizontal.periodoOnda=90


# ---------------------------------------------------------------------
# FASE 1 - "INDO PARA DCO"
# ---------------------------------------------------------------------
# DURACAO: totalDeOndas x intervaloEntreOndas / 60 = segundos (mais a cauda
# da ultima onda sair da tela). Com 30 x 300 da ~2min40, na faixa de um
# estagio de Touhou. Pra encurtar, mexa em totalDeOndas.
#
# Espera antes do primeiro inimigo aparecer
fase1.ticksAteComecar=90
# Ticks entre o inicio de uma onda e o da proxima.
# Cuidado: o pendulo leva ~9s pra atravessar, entao intervalo curto faz
# varias ondas se sobreporem e o pico de inimigos vivos disparar.
fase1.intervaloEntreOndas=300
fase1.totalDeOndas=10

# Rampa de dificuldade: as ondas crescem da primeira ate a ultima.
# Deixe os dois iguais pra desligar a rampa.
fase1.inimigosPorOndaInicio=3
fase1.inimigosPorOndaFim=7

# Ticks entre o nascimento de um inimigo e o do seguinte, DENTRO da mesma
# onda. E isso que faz eles virem em fila em vez de todos de uma vez.
fase1.atrasoEntreInimigos=18

# Chance de cada padrao ser sorteado, POR ONDA (a onda inteira usa o mesmo
# padrao). Sao pesos relativos: 50/25/25 da 50%, 25% e 25%.
# Pode usar qualquer numero, nao precisa somar 100.
# Os tres primeiros sao os inimigos VERMELHOS (inimigo.png). Os pesos
# foram reduzidos porque a fase estava vermelha demais: eles eram 76% das
# ondas, e os dois inimigos novos (disquete e monitor) quase nao
# apareciam. Agora sao ~61%, com o resto dividido entre os outros dois.
fase1.pesoPendulo=30
fase1.pesoArco=16
fase1.pesoHorizontal=16

# Semente do sorteio das ondas.
#   -1        = aleatorio a cada partida
#   qualquer  = as ondas saem SEMPRE na mesma ordem (util pra testar
#   numero >=0  um ajuste sem a aleatoriedade atrapalhar)
fase1.seed=-1


# ---------------------------------------------------------------------
# FUNDO DA FASE (foto do DCO + efeitos estilo Touhou)
# ---------------------------------------------------------------------
# Cenario do estagio 1, "INDO PARA DCO": ele esta ATRAVESSANDO o campus,
# ainda nao chegou no departamento.
#
# O elenco de cenarios, na ordem da historia:
#   portaria1.png  entrada (intro; e a PORTARIA 1 mesmo — portaria.png e a 2)
#   campus.png     o caminho, estagios 1 a 3
#   sala7.png      a Adriana, estagios 2 e 3
#   dco.png        o Clayton, estagios 4 e 5 (corredor do Depto de Computacao)
#   lepec.png      o PAPA, estagios 6 e 7
#   uba.png        a foto final
fundo.imagem=sprites/ambient/campus.png

# Ticks de TRANSICAO entre um cenario e outro. A foto antiga desvanece por
# cima da nova, e as duas continuam rolando. 90 ticks = 1,5 s.
# Corte seco denunciava que houve uma "cena": o jogo piscava e o jogador
# sentia que saiu do mundo. 0 volta ao corte seco.
fundo.ticksDeTransicao=90

# A foto nao emenda com ela mesma (o asfalto do rodape encostaria no ceu
# do topo e apareceria um corte a cada volta do loop). Estas linhas do
# rodape sao dissolvidas por cima do topo pra emenda sumir.
# Maior = transicao mais suave, porem come mais da foto.
# 0 desliga o tratamento (o corte volta a aparecer).
fundo.faixaDeEmenda=250

# Pixels por tick que a foto desce. Maior = sensacao de andar mais rapido.
# 0 deixa o fundo parado.
fundo.velocidadeScroll=0.35

# ATENCAO: estes dois sao o que deixa as balas legiveis por cima da foto.
# Zerar os dois mostra a foto original, mas o jogo fica dificil de ler.
# Escurecimento chapado, 0 a 255
fundo.escurecimento=130
# Tinta colorida por cima (cria o clima). Alpha 0 desliga.
fundo.tintR=40
fundo.tintG=30
fundo.tintB=90
fundo.tintAlpha=70
# A tinta "respira": o alpha oscila esta amplitude neste periodo (ticks).
fundo.pulsoAmplitude=25
fundo.pulsoPeriodo=240

# Escuridao nas bordas do campo, 0 a 255. 0 desliga.
fundo.vinheta=150

# Poeira luminosa subindo no fundo. 0 desliga.
fundo.particulas=45
fundo.particulaVelocidadeMin=0.4
fundo.particulaVelocidadeMax=1.6
fundo.particulaTamanhoMin=2
fundo.particulaTamanhoMax=6


# ---------------------------------------------------------------------
# CHEFES (valores compartilhados por todos os bosses)
# ---------------------------------------------------------------------
# Raio de COLISAO do chefe (bem menor que o sprite, de proposito)
chefe.raio=64.0

# O CORPO DO CHEFE MACHUCA, e este e o raio disso (fracao do raio acima).
#
# Sem contato, existia um buraco que resolvia o jogo: dava pra colar no
# chefe e passar todos os ataques encostado nele. Faz sentido
# geometricamente — quase todo padrao NASCE nele e vai pra fora, entao o
# ponto mais seguro do campo era em cima da origem. Um bullet hell em que
# o lugar mais seguro e o centro do inimigo nao e um bullet hell.
#
# 0.55 = 35 px, MENOR que o raio de tiro (64). O de tiro e generoso de
# proposito, pra acertar um alvo grande nao virar teste de pontaria; usar
# ele aqui puniria chegar perto, e chegar perto e legitimo (e assim que se
# causa dano rapido). Este cobre so o corpo: da pra ficar colado, nao
# DENTRO.
chefe.fatorDoRaioDeContato=0.55
# Altura em que ele flutua, em fracao da altura do campo
# Altura em que o chefe fica. Desceu de 0.16 pra 0.26 junto com a
# diminuicao dos sprites: menor e mais pra baixo, ele para de ocupar o
# topo inteiro e sobra campo pra ler os padroes que saem dele.
chefe.alturaRelY=0.26

# --- MARCADOR DO CHEFE NO RODAPE ---
# A marquinha brilhando na parte de baixo mostrando em que coluna ele
# esta, igual a da serie.
#
# Ela resolve um problema concreto: o jogador passa a luta na faixa de
# baixo olhando pras balas que vem na cara dele, e levantar o olho ate o
# topo pra achar o chefe custa exatamente o instante em que ele mais
# precisa olhar pra baixo. Na pratica, ele atira no escuro. Com o
# marcador, "onde mirar" fica no mesmo lugar pra onde ele ja esta olhando.
#
# Ela fica BRANCA enquanto o chefe esta invulneravel na troca de ataque —
# um "nao adianta atirar agora" sem escrever isso em lugar nenhum.
chefe.alturaDoIndicador=10
chefe.larguraDoIndicador=26
# Deriva horizontal: o quanto ele vai pros lados e em quantos ticks
chefe.amplitudeDeriva=150.0
chefe.periodoDeriva=360.0
# Invulnerabilidade ao trocar de spell card (da tempo da tela limpar)
chefe.ticksInvulnerabilidadeNaTroca=90
# Quanto tempo o nome do ataque fica em destaque na tela
# --- BONUS DE CAPTURA ---
# "Capturar" um spell card e quebra-lo no HP sem morrer e sem bombar.
# So a captura limpa vale bonus; estourar o tempo nao conta.
# O valor decai com o tempo gasto ate fracaoMinimaDoBonus — sem esse
# decaimento a jogada otima seria ficar so desviando sem atirar.
chefe.bonusDeCaptura=12000
chefe.fracaoMinimaDoBonus=0.25

chefe.ticksAnuncio=120
chefe.pontosAoMorrer=5000
chefe.itensAoMorrer=30
# Itens soltos ao completar cada spell card
chefe.itensPorSpellCard=8


# ---------------------------------------------------------------------
# ADRIANA - primeira chefe (Roteiro.txt linhas 19 a 40)
# ---------------------------------------------------------------------
adriana.escalaSprite=2.4
adriana.escalaSpriteMaligna=2.6

# --- Spell 1: Integral Indefinida (forma base) ---
# Desenha o simbolo da integral com balas e joga no jogador.
adriana.integral.hp=260
adriana.integral.duracao=1800
# Ticks entre um simbolo e o proximo
adriana.integral.cadencia=90
# Quantas balas formam o desenho (menos = mais buracos pra passar)
adriana.integral.balasPorSimbolo=28
# Largura e altura do simbolo em pixels. A proporcao importa: com a
# largura muito perto da altura o desenho vira uma onda generica em vez
# de um "∫". 34x280 foi o que leu melhor.
adriana.integral.amplitude=34
adriana.integral.altura=280
adriana.integral.velocidadeBala=2.4
adriana.integral.raioBala=6.0
# ESPALHAMENTO: depois de N ticks mantendo a forma do simbolo, o grupo de
# balas se desfaz num dos 3 padroes (LEQUE, ESPIRAL, DIVERGENTE), ciclados
# a cada disparo. A direcao vem do INDICE da bala no grupo, nao de sorteio:
# assim o jogador consegue ler a abertura e escolher a brecha.
# 0 em ticksAteEspalhar desliga o efeito.
adriana.integral.ticksAteEspalhar=70
# Abertura TOTAL do padrao, em radianos (maior = leque mais aberto)
adriana.integral.aberturaEspalhamento=0.9
# Multiplicador de velocidade ao espalhar. 1.0 = nao acelera.
adriana.integral.ganhoVelocidade=1.15

# --- Spell 2: Somatorio de Faltas (forma base) ---
# Dois sigmas descem, um de cada lado, fechando o corredor do meio.
adriana.somatorio.hp=300
adriana.somatorio.duracao=1800
adriana.somatorio.cadencia=110
adriana.somatorio.balasPorSimbolo=34
adriana.somatorio.escalaX=60
adriana.somatorio.escalaY=70
adriana.somatorio.velocidadeBala=1.9
# Quanto os dois sigmas se aproximam do centro enquanto caem.
# 0 = descem retos (mais facil).
adriana.somatorio.aceleracaoLateral=0.012
adriana.somatorio.raioBala=6.0
adriana.somatorio.ticksAteEspalhar=85
adriana.somatorio.aberturaEspalhamento=0.8
adriana.somatorio.ganhoVelocidade=1.15
# --- SPELL 3: Cachorros que Sabem Calculo (forma maligna) ---
# Roteiro.txt linha 31. A Adriana invoca uma matilha; cada cachorro entra
# por uma lateral, para e late EQUACOES miradas no jogador.
# O que este ataque cobra e ATENCAO DIVIDIDA: as balas nascem em varios
# lugares da tela e nenhum deles e a chefe.
adriana.cachorros.hpDoSpell=360
adriana.cachorros.duracao=1800

# --- a matilha ---
# Quantos cachorros ela tenta manter vivos. Ela REPOE quando minguam,
