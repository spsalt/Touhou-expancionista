# sala vazia ate o tempo acabar.
adriana.cachorros.matilha=5
adriana.cachorros.intervaloDeInvocacao=120
adriana.cachorros.porInvocacao=2

# Faixa de altura (fracao do campo) em que eles param. Fica no meio: em
# cima colidiria com a chefe, embaixo colaria no jogador.
adriana.cachorros.faixaTopoRelY=0.30
adriana.cachorros.faixaBaixoRelY=0.62

# --- cada cachorro ---
adriana.cachorros.hp=22
adriana.cachorros.raio=17
adriana.cachorros.sprite=sprites/enemies/cachorro.png
adriana.cachorros.escalaSprite=2.4
adriana.cachorros.velocidadeDeEntrada=3.2
adriana.cachorros.margemDeParada=70
adriana.cachorros.pontos=300
adriana.cachorros.itens=2

# Ticks entre latidos, e quantos ticks ele fica AGACHADO antes de latir.
