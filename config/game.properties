adriana.cachorros.cadenciaDoAnel=96
adriana.cachorros.balasDoAnel=10
adriana.cachorros.velocidadeDoAnel=2.0
adriana.cachorros.raioDoAnel=8.0
adriana.cachorros.tamanhoDaFonteDoAnel=18

