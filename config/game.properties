# =====================================================================
#  TOUHOU EXPANCIONISTA - AJUSTES DE JOGABILIDADE
# =====================================================================
#  Mexa nos numeros deste arquivo e rode o jogo de novo (ou aperte F5
#  dentro do jogo) para testar. NAO precisa recompilar nada.
#
#  Se uma chave estiver faltando ou com valor invalido, o jogo usa o
#  valor padrao que esta escrito dentro do codigo e avisa no console.
# =====================================================================


# ---------------------------------------------------------------------
# JANELA
# ---------------------------------------------------------------------
janela.largura=1080
janela.altura=720
janela.fps=60


# ---------------------------------------------------------------------
# CAMPO DE JOGO (a "arena" onde as balas valem, estilo Touhou)
# O resto da janela vira o painel lateral de status.
# ---------------------------------------------------------------------
campo.x=32
campo.y=16
campo.largura=600
campo.altura=688


# ---------------------------------------------------------------------
# JOGADOR
# ---------------------------------------------------------------------
# Posicao inicial em fracao do campo (0.5 = meio, 0.8 = perto do fundo)
jogador.spawnRelX=0.5
jogador.spawnRelY=0.8

jogador.velocidade=4.0
# Velocidade com X segurado (modo foco, para desviar com precisao)
jogador.velocidadeFoco=1.75

# Raio da hitbox real (bolinha verde). Menor = mais facil desviar.
jogador.raioHitbox=3.0
# Raio de coleta automatica de itens (circulo azul)
jogador.raioColeta=55.0
# Tamanho do RETRATO em relacao a hitbox. So aparencia — a colisao real
# continua sendo o raioHitbox de cima, entao aumentar isso nao deixa o
# jogo mais dificil, so o personagem mais visivel.
jogador.escalaSprite=5.6

jogador.vidas=40
# Cargas da GPT EXPANSION (o ataque especial — ver secao GPT EXPANSAO mais
# abaixo). Chamado de "bombas" aqui no codigo por convencao de bullet hell,
# mas na HUD e no jogo aparece sempre como "GPT Expansion".
jogador.bombas=5

# --- progressao de nivel (cada nivel desbloqueia um TIPO de tiro novo,
#     ver a secao TIPOS DE TIRO DO JOGADOR mais abaixo) ---
# Custo do nivel N = xpBase * fatorXpPorNivel ^ (N-1)
# Com 12 e 2.4:  N2=12  N3=29  N4=69  N5=166  N6=398 itens
# Cada inimigo dropa 2 itens (inimigo.itensAoMorrer).
# BAIXE o xpBase ou o fator pra subir de nivel mais rapido.
jogador.xpBase=8
jogador.fatorXpPorNivel=1.6
# Teto de nivel. E ate onde os tipos de tiro sao desbloqueados.
jogador.nivelMaximo=5
# Ja no teto, cada item pego vira esta quantidade de pontos
jogador.xpEmPontosNoNivelMaximo=50
# Ticks de invencibilidade depois de levar dano. As balas NAO sao mais
# apagadas quando voce apanha — esta janela e toda a protecao pra sair de
# onde estava, entao ela precisa ser generosa (120 = 2 segundos).
jogador.invulnerabilidadeTicks=120

# Tiro automatico ligado ao comecar a partida.
# Em jogo, a tecla C liga/desliga a qualquer momento.
jogador.autofireInicial=true

# Cadencia de tiro em ticks (menor = atira mais rapido)
jogador.cadenciaTiro=5
# Abertura do leque de tiros, em radianos
jogador.aberturaTiro=0.5
jogador.aberturaTiroFoco=0.1
jogador.velocidadeBala=12.0
jogador.raioBala=4.0
jogador.danoBala=1.0


# ---------------------------------------------------------------------
# TIPOS DE TIRO DO JOGADOR
# ---------------------------------------------------------------------
# Cada nivel DESBLOQUEIA um tipo novo, em vez de so somar +1 bala:
#
#   N1  leque
#   N2  leque + PONTEIROS   (teleguiados, fracos, verdes)
#   N3  leque maior + ponteiros
#   N4  + RICOCHETES        (losangos laranjas que quicam nas laterais)
#   N5  tudo, leque cheio
#
# Cada tipo resolve um problema diferente: leque e dano de frente,
# ponteiro caça quem fugiu pro canto, ricochete alcança quem esta colado
# na parede.

# Teto de balas do leque. Baixo de proposito — o poder novo vem dos TIPOS.
tiro.leque.maximo=4

# Sprite da bala normal (capsula ciano). Se o PNG sumir, volta pro circulo.
tiro.leque.sprite=sprites/GFX/bala_leque.png

# --- PONTEIRO (teleguiado) ---
# Em que nivel ele aparece
tiro.ponteiro.nivel=2
tiro.ponteiro.maximo=3
tiro.ponteiro.velocidade=7.5
# Radianos que ele gira por tick. MAIOR = persegue mais agressivo.
# Baixo de proposito: da limite ao teleguiamento, entao alvo rapido escapa
# e a bala nao vira acerto garantido.
tiro.ponteiro.taxaDeGiro=0.10
tiro.ponteiro.raio=4.5
# Dano em fracao do tiro normal. Fraco: o valor dele e a cobertura.
tiro.ponteiro.fatorDano=0.18

# Sprite da teleguiada: SETA verde. Ela e desenhada meio transparente pra
# o jogador ler na hora que aquela bala e a fraca — a forma diz o que ela
# faz (aponta) e a opacidade diz o quanto ela machuca.
tiro.ponteiro.sprite=sprites/GFX/bala_ponteiro.png
tiro.ponteiro.opacidade=0.55

# --- RICOCHETE (quica nas laterais) ---
tiro.ricochete.nivel=4
tiro.ricochete.velocidade=9.0
tiro.ricochete.raio=4.5
tiro.ricochete.fatorDano=0.45
# Angulo de saida em graus (0 = reto pra cima)
tiro.ricochete.anguloGraus=38
# Quantos quiques antes de sumir. Sem esse limite, uma diagonal perfeita
# ficaria presa entre as duas paredes pra sempre.
tiro.ricochete.quiques=3

# Sprite da bala que quica: faisca laranja de 4 pontas.
tiro.ricochete.sprite=sprites/GFX/bala_ricochete.png
# Tamanho do desenho em relacao ao raio de colisao. Menor que as outras
# balas de proposito: ela quica pela tela inteira, entao um sprite grande
# poluia a leitura no meio de um padrao de chefe.
tiro.ricochete.escalaSprite=1.7


# ---------------------------------------------------------------------
# PROJETEIS (geral)
# ---------------------------------------------------------------------
# Margem fora do campo antes da bala ser apagada da memoria.
# Precisa ser > 0 senao balas que nascem na borda somem na hora.
bala.margemSaida=48


# ---------------------------------------------------------------------
# INIMIGOS DE ONDA - valores COMPARTILHADOS pelos tres padroes
# ---------------------------------------------------------------------
inimigo.hp=6.0
# Raio de COLISAO (onde as balas do jogador acertam)
inimigo.raio=10.0
# Tamanho do DESENHO em relacao ao raio. Separado da colisao de proposito:
# da pra deixar o sprite maior sem deixar o inimigo mais facil de acertar.
inimigo.escalaSprite=2.2
inimigo.sprite=sprites/enemies/inimigo.png
# Ticks entre cada tiro (maior = atira menos)
inimigo.cadenciaTiro=50
inimigo.velocidadeBala=3.2
inimigo.raioBala=5.0
inimigo.pontosAoMorrer=100
# Itens de XP dropados por inimigo. Junto com jogador.xpBase, e o que
# controla a velocidade da progressao de nivel.
inimigo.itensAoMorrer=2


# ---------------------------------------------------------------------
# PADRAO PENDULO - desce pelo topo, fica lento no meio, segue e sai
# ---------------------------------------------------------------------
inimigo.pendulo.velocidade=3.2
# Quanto ele desacelera na zona lenta.
#   0    = nao desacelera (cai reto)
#   0.85 = cai pra 15% da velocidade no centro da zona
#   1.0  = para completamente (evite: ele nunca sai da tela)
inimigo.pendulo.lentidaoMaxima=0.85
# Onde fica o centro da zona lenta, em fracao da altura do campo
inimigo.pendulo.zonaLentaRelY=0.45
# Largura da zona lenta em pixels. Maior = freia mais cedo e por mais tempo.
inimigo.pendulo.larguraZonaLenta=110


# ---------------------------------------------------------------------
# PADRAO ARCO - entra pelo lado, curva 90 graus e sai por cima
# ---------------------------------------------------------------------
inimigo.arco.velocidade=3.0
# Raio da curva em pixels. Menor = vira rapido e fecha o arco perto da
# borda; maior = curva aberta que atravessa boa parte da tela.
inimigo.arco.raioDaCurva=170
# Altura em que entram, em fracao da altura do campo.
# Todos da mesma onda usam esta altura (e o que faz virar fila indiana).
inimigo.arco.entradaRelY=0.55


# ---------------------------------------------------------------------
# PADRAO HORIZONTAL - atravessa de um lado da tela ao outro
# ---------------------------------------------------------------------
inimigo.horizontal.velocidade=3.4
# Faixa de alturas da travessia. Os inimigos da onda sao distribuidos
# entre o minimo e o maximo, entao a fila entra na diagonal.
# Deixe os dois iguais pra todos passarem na mesma altura.
inimigo.horizontal.entradaRelYMin=0.10
inimigo.horizontal.entradaRelYMax=0.45
# Balanco senoidal no Y durante a travessia. 0 = linha reta.
inimigo.horizontal.amplitudeOnda=0
inimigo.horizontal.periodoOnda=90


# ---------------------------------------------------------------------
# FASE 1 - "INDO PARA DCO"
# ---------------------------------------------------------------------
# DURACAO: totalDeOndas x intervaloEntreOndas / 60 = segundos (mais a cauda
# da ultima onda sair da tela). Com 30 x 300 da ~2min40, na faixa de um
# estagio de Touhou. Pra encurtar, mexa em totalDeOndas.
#
# Espera antes do primeiro inimigo aparecer
fase1.ticksAteComecar=90
# Ticks entre o inicio de uma onda e o da proxima.
# Cuidado: o pendulo leva ~9s pra atravessar, entao intervalo curto faz
# varias ondas se sobreporem e o pico de inimigos vivos disparar.
fase1.intervaloEntreOndas=300
fase1.totalDeOndas=10

# Rampa de dificuldade: as ondas crescem da primeira ate a ultima.
# Deixe os dois iguais pra desligar a rampa.
fase1.inimigosPorOndaInicio=4
fase1.inimigosPorOndaFim=8

# Ticks entre o nascimento de um inimigo e o do seguinte, DENTRO da mesma
# onda. E isso que faz eles virem em fila em vez de todos de uma vez.
fase1.atrasoEntreInimigos=18

# Chance de cada padrao ser sorteado, POR ONDA (a onda inteira usa o mesmo
# padrao). Sao pesos relativos: 50/25/25 da 50%, 25% e 25%.
# Pode usar qualquer numero, nao precisa somar 100.
fase1.pesoPendulo=50
fase1.pesoArco=25
fase1.pesoHorizontal=25

# Semente do sorteio das ondas.
#   -1        = aleatorio a cada partida
#   qualquer  = as ondas saem SEMPRE na mesma ordem (util pra testar
#   numero >=0  um ajuste sem a aleatoriedade atrapalhar)
fase1.seed=-1


# ---------------------------------------------------------------------
# FUNDO DA FASE (foto do DCO + efeitos estilo Touhou)
# ---------------------------------------------------------------------
fundo.imagem=sprites/ambient/dco.png

# A foto nao emenda com ela mesma (o asfalto do rodape encostaria no ceu
# do topo e apareceria um corte a cada volta do loop). Estas linhas do
# rodape sao dissolvidas por cima do topo pra emenda sumir.
# Maior = transicao mais suave, porem come mais da foto.
# 0 desliga o tratamento (o corte volta a aparecer).
fundo.faixaDeEmenda=250

# Pixels por tick que a foto desce. Maior = sensacao de andar mais rapido.
# 0 deixa o fundo parado.
fundo.velocidadeScroll=0.35

# ATENCAO: estes dois sao o que deixa as balas legiveis por cima da foto.
# Zerar os dois mostra a foto original, mas o jogo fica dificil de ler.
# Escurecimento chapado, 0 a 255
fundo.escurecimento=130
# Tinta colorida por cima (cria o clima). Alpha 0 desliga.
fundo.tintR=40
fundo.tintG=30
fundo.tintB=90
fundo.tintAlpha=70
# A tinta "respira": o alpha oscila esta amplitude neste periodo (ticks).
fundo.pulsoAmplitude=25
fundo.pulsoPeriodo=240

# Escuridao nas bordas do campo, 0 a 255. 0 desliga.
fundo.vinheta=150

# Poeira luminosa subindo no fundo. 0 desliga.
fundo.particulas=45
fundo.particulaVelocidadeMin=0.4
fundo.particulaVelocidadeMax=1.6
fundo.particulaTamanhoMin=2
fundo.particulaTamanhoMax=6


# ---------------------------------------------------------------------
# CHEFES (valores compartilhados por todos os bosses)
# ---------------------------------------------------------------------
# Raio de COLISAO do chefe (bem menor que o sprite, de proposito)
chefe.raio=64.0
# Altura em que ele flutua, em fracao da altura do campo
chefe.alturaRelY=0.16
# Deriva horizontal: o quanto ele vai pros lados e em quantos ticks
chefe.amplitudeDeriva=150.0
chefe.periodoDeriva=360.0
# Invulnerabilidade ao trocar de spell card (da tempo da tela limpar)
chefe.ticksInvulnerabilidadeNaTroca=90
# Quanto tempo o nome do ataque fica em destaque na tela
chefe.ticksAnuncio=120
chefe.pontosAoMorrer=5000
chefe.itensAoMorrer=30
# Itens soltos ao completar cada spell card
chefe.itensPorSpellCard=8


# ---------------------------------------------------------------------
# ADRIANA - primeira chefe (Roteiro.txt linhas 19 a 40)
# ---------------------------------------------------------------------
adriana.escalaSprite=3.2
adriana.escalaSpriteMaligna=3.5

# --- Spell 1: Integral Indefinida (forma base) ---
# Desenha o simbolo da integral com balas e joga no jogador.
adriana.integral.hp=260
adriana.integral.duracao=1800
# Ticks entre um simbolo e o proximo
adriana.integral.cadencia=90
# Quantas balas formam o desenho (menos = mais buracos pra passar)
adriana.integral.balasPorSimbolo=28
# Largura e altura do simbolo em pixels. A proporcao importa: com a
# largura muito perto da altura o desenho vira uma onda generica em vez
# de um "∫". 34x280 foi o que leu melhor.
adriana.integral.amplitude=34
adriana.integral.altura=280
adriana.integral.velocidadeBala=2.4
adriana.integral.raioBala=6.0
# ESPALHAMENTO: depois de N ticks mantendo a forma do simbolo, o grupo de
# balas se desfaz num dos 3 padroes (LEQUE, ESPIRAL, DIVERGENTE), ciclados
# a cada disparo. A direcao vem do INDICE da bala no grupo, nao de sorteio:
# assim o jogador consegue ler a abertura e escolher a brecha.
# 0 em ticksAteEspalhar desliga o efeito.
adriana.integral.ticksAteEspalhar=70
# Abertura TOTAL do padrao, em radianos (maior = leque mais aberto)
adriana.integral.aberturaEspalhamento=0.9
# Multiplicador de velocidade ao espalhar. 1.0 = nao acelera.
adriana.integral.ganhoVelocidade=1.15

# --- Spell 2: Somatorio de Faltas (forma base) ---
# Dois sigmas descem, um de cada lado, fechando o corredor do meio.
adriana.somatorio.hp=300
adriana.somatorio.duracao=1800
adriana.somatorio.cadencia=110
adriana.somatorio.balasPorSimbolo=34
adriana.somatorio.escalaX=60
adriana.somatorio.escalaY=70
adriana.somatorio.velocidadeBala=1.9
# Quanto os dois sigmas se aproximam do centro enquanto caem.
# 0 = descem retos (mais facil).
adriana.somatorio.aceleracaoLateral=0.012
adriana.somatorio.raioBala=6.0
adriana.somatorio.ticksAteEspalhar=85
adriana.somatorio.aberturaEspalhamento=0.8
adriana.somatorio.ganhoVelocidade=1.15
# --- SPELL 3: Somas de Riemann (forma maligna) ---
# Bolinhas saem da chefe em BRACOS que giram devagar; entre os bracos
# sobram corredores curvos. Depois de cada rajada vem uma pausa (alivio)
# pro jogador trocar de corredor — e o giro inverte de sentido.
adriana.riemann.hp=340
adriana.riemann.duracao=1800

# Quantos bracos por disparo. MAIS bracos = corredores mais estreitos.
adriana.riemann.bracos=14

# Ticks entre disparos. Deve deixar velocidadeBala*cadencia POUCO ABAIXO
# do diametro da bala (2*raioBala), senao o braco vira fileira furada.
adriana.riemann.cadencia=6

# Quanto o padrao gira por disparo, em radianos. CUIDADO: o corredor
# desliza giro/cadencia*distancia px por tick. Acima de ~0.05 ele foge
# do jogador e o ataque vira sorte. Veja o console em modo debug (F3).
adriana.riemann.giro=0.035

adriana.riemann.velocidadeBala=1.9
adriana.riemann.raioBala=6.0

# Onde as balas nascem, em relacao ao centro da chefe.
adriana.riemann.alturaSaida=30

# O ciclo: atira por X ticks, descansa por Y.
adriana.riemann.ticksDeRajada=270
adriana.riemann.ticksDeAlivio=110


# --- Spell 4: Solido de Revolucao (forma maligna, ATAQUE 3D) ---
# Esfera de balas em espaco 3D real, girando e projetada em perspectiva.
adriana.esfera.hp=380
adriana.esfera.duracao=2000
adriana.esfera.cadencia=90
# Quantas balas na superficie da esfera
adriana.esfera.balas=170
adriana.esfera.raioInicial=30
adriana.esfera.velocidadeExpansao=1.2
adriana.esfera.raioBala=4.0
# Quanto da bala DESENHADA conta como hitbox (0 a 1). O sprite continua do
# mesmo tamanho — so a colisao encolhe, deixando o ataque generoso sem
# perder a cara de esfera densa.
adriana.esfera.fatorHitbox=0.62
# Distancia da camera. MENOR = perspectiva mais exagerada (balas da frente
# crescem muito). MAIOR = quase 2D e o efeito 3D se perde.
# Com 240 a escala varia de 0.64 a 2.26 (bala da frente chega a 14px de
# raio) — foi o valor em que o volume da esfera ficou mais legivel sem
# gerar hitbox injusta. Com 420 quase nao da pra perceber profundidade.
adriana.esfera.distanciaCamera=280
# Giro da esfera em radianos por tick. 0 = nao gira.
adriana.esfera.velocidadeGiro=0.008
# Desloca o centro da esfera pra baixo do chefe
adriana.esfera.deslocamentoY=60
# Tres esferas por ciclo, espacadas: viram cascas concentricas crescendo.
adriana.esfera.esferasPorCiclo=1
adriana.esfera.intervaloEntreEsferas=50
# Distancia percorrida em que a bala termina de virar violeta (nasce vermelha)
adriana.esfera.distanciaAteVioleta=200

# --- LIMITES DE VIDA DAS BALAS 3D ---
# Sair do campo NAO basta pra matar estas balas: a que viaja pelo eixo Z
# se afasta "pra dentro da tela", encolhe rumo ao centro e nunca cruza a
# borda. Sem os limites abaixo, metade da esfera ficava viva pra sempre e
# a tela ia entupindo a cada nova esfera.
#
# Distancia 3D maxima do centro antes da bala sumir.
adriana.esfera.alcanceMaximo=450
# Teto de tempo, em ticks. Deixe MENOR que adriana.esfera.cadencia pra
# cada esfera limpar antes da proxima nascer.
adriana.esfera.vidaMaximaTicks=240
# Ticks finais em que ela vai sumindo (evita apagar de estalo).
adriana.esfera.ticksDeFade=45


# ---------------------------------------------------------------------
# GPT EXPANSAO (ataque especial — tecla V ou clique no logo do HUD)
# ---------------------------------------------------------------------
# Raio maximo que a explosao alcanca, em pixels. Mata todo inimigo e
# apaga toda bala (sua ou inimiga) que ela tocar.
# Bonus de alcance por nivel do jogador: raio = raioMaximo * (1 + (nivel-1)*bonus)
gptExpansao.bonusPorNivel=0.18
gptExpansao.raioMaximo=240
# Ticks pra crescer de 0 ate o raio maximo (a "onda de choque")
gptExpansao.ticksExpansao=26
# Ticks parada no tamanho maximo antes de comecar a sumir
gptExpansao.ticksSustentacao=12
# Ticks pra desaparecer (fade out)
gptExpansao.ticksFade=18
# Velocidade de giro da logo, em radianos por tick
gptExpansao.velocidadeRotacao=0.16
# Dano num CHEFE, aplicado uma vez por explosao. A bomba nao mata chefe:
# deixar matar tornaria qualquer spell card trivial (bastava guardar
# cargas e pular a luta). Como referencia, os spell cards tem 300-460 HP,
# entao 90 tira cerca de 1/4 de um deles.
gptExpansao.danoEmChefe=90.0


# ---------------------------------------------------------------------
# CUTSCENE (a abertura "entrando na faculdade", antes da fase 1)
# ---------------------------------------------------------------------
# Caracteres por tick no efeito maquina de escrever. Maior = texto aparece
# mais rapido. O primeiro Z/ENTER numa linha sempre completa ela na hora,
# entao este numero so afeta quem le sem apertar nada.
cutscene.velocidadeTexto=0.9
# Quanto a foto de fundo e escurecida (0 a 255). Sem isso o texto branco
# some no ceu claro da foto da portaria.
cutscene.escurecimentoFundo=110
# Quanto o retrato caminha por tick ao entrar/sair de foco (0 a 1).
# Menor = deslize mais lento e suave; 1 = teleporte instantaneo.
cutscene.suavidadeRetrato=0.12

# Escurecimento da foto da portaria no menu
menu.escurecimentoFundo=150
# Tamanho do item de XP (simbolo da UNESP), em pixels
item.tamanho=18


# ---------------------------------------------------------------------
# MUSICA
# ---------------------------------------------------------------------
# O javax.sound.sampled do Java puro so le WAV (nao MP3), por isso a
# trilha fica em audio/*.wav. Toca em loop assim que a FASE comeca
# (nao durante a cutscene) e pausa/retoma junto com o ESC.
musica.ativada=true
musica.arquivo=audio/fase1.wav
# 0.0 (mudo) a 1.0 (volume original do arquivo)
musica.volume=0.6

# --- efeitos sonoros (tiros) ---
som.ativado=true
# Volume dos efeitos. Baixo de proposito: o jogador atira ~12x por segundo,
# e som alto nessa cadencia abafa a musica e cansa em poucos segundos.
som.volume=0.35
# Quantas copias de cada som ficam carregadas. Um Clip so toca uma vez por
# vez, entao com poucas vozes os tiros rapidos sairiam mudos.
som.vozes=4


# ---------------------------------------------------------------------
# DEBUG - liga/desliga ajudas visuais e codigo de teste
# ---------------------------------------------------------------------
# Mostra no topo do campo qual onda e qual padrao estao rolando
# Pula direto pra fase ao clicar "Jogar", sem passar pela cutscene.
# Ligue enquanto estiver testando jogabilidade.
# MODO DEBUG (tecla F3 liga/desliga em jogo): mostra FPS, hitbox dos
# inimigos, info da onda, e libera o F2 (pular estagio).
# Deixe false pra apresentar.
debug.modoDebug=false

debug.pularCutscenes=false
# Codigo de teste antigo: balas vindas dos 4 cantos a cada tiro
debug.balasDosCantos=false
# Codigo de teste antigo: chuva de itens no meio da tela
debug.pontosDeTeste=false

# ---------------------------------------------------------------------
# CLAYTON - segundo chefe (Roteiro.txt linhas 41 a 57)
# ---------------------------------------------------------------------
clayton.sprite=sprites/bosses/clayton-base.png
clayton.spriteMaligno=sprites/bosses/Clayton-Maligno.png
clayton.escalaSprite=3.4
clayton.escalaSpriteMaligna=3.8

# --- Spell 1: Xeque-Mate Sistematico (pecas de xadrez) ---
# As pecas andam em LANCES: deslizam ate a casa, param, e so entao
# escolhem o proximo movimento seguindo as regras da peca.
clayton.xadrez.hp=350
clayton.xadrez.duracao=1900
clayton.xadrez.cadencia=90
clayton.xadrez.pecasPorLevada=5
# Tamanho da "casa" do tabuleiro em pixels (o passo de cada lance)
clayton.xadrez.tamanhoDaCasa=84
clayton.xadrez.velocidade=4.2
# Pausa entre lances. E a janela em que o jogador LE pra onde a peca vai.
# Diminuir isso deixa o padrao bem mais dificil de antecipar.
clayton.xadrez.pausaEntreLances=35
# Quantos lances cada peca da antes de sair do tabuleiro
clayton.xadrez.lancesPorPeca=7
# Vies de avanco: chance de um lance vertical ir pra BAIXO em vez de pra
# cima. Sem isso as pecas ficavam vagando no topo, coladas no Clayton.
clayton.xadrez.viesParaBaixo=0.80
clayton.xadrez.raio=17

# --- Spell 2: Claytonlings (minions covardes) ---
clayton.claytonlings.hp=320
clayton.claytonlings.duracao=2000
clayton.claytonlings.cadencia=80
clayton.claytonlings.porLevada=4
# Teto de minions vivos: sem isso, jogador que nao desvia acumula parede
clayton.claytonlings.limiteNaTela=20

# HP de cada claytonling. O corpo dele E o ataque (da dano ao encostar),
# entao ele precisa aguentar tiro o bastante pra chegar em voce — senao
# morre no caminho e a spell card nao ameaca nada.
clayton.claytonling.hp=18.7
clayton.claytonling.raio=20
clayton.claytonling.velocidade=2.2
clayton.claytonling.velocidadeFuga=8.5
# --- INVESTIDA (o que torna o desvio possivel) ---
# A esta distancia ele TRAVA a rota e parte reto, sem corrigir mais.
# Antes ele corrigia a cada tick e, sendo mais rapido que o jogador,
# nao existia desvio — era so questao de tempo ate encostar.
# Maior = trava mais longe = mais facil desviar.
clayton.claytonling.raioDeInvestida=190.0
# Velocidade durante a investida travada (mais rapida que a aproximacao)
clayton.claytonling.velocidadeInvestida=6.2
clayton.claytonling.sprite=sprites/bosses/clayton-base.png
clayton.claytonling.escalaSprite=2.4
clayton.claytonling.pontos=120
clayton.claytonling.itens=2
# So considera "fui desviado" depois de ter chegado a esta distancia.
# Sem isso ele fugiria logo no inicio, quando a distancia ainda oscila.
clayton.claytonling.raioDeAproximacao=90.0
# Quanto a distancia precisa CRESCER, alem do minimo ja atingido, pra ele
# desistir. Maior = mais teimoso (exige desvio mais claro).
clayton.claytonling.folgaDeDesvio=30.0
# Se perseguir tempo demais sem encostar, desiste do mesmo jeito
clayton.claytonling.ticksAteDesistir=300

# --- Spell 3 (FINAL): LATEX ---
# Um artigo em LaTeX desce pela tela. As LETRAS machucam, os espacos entre
# palavras e as entrelinhas sao seguros. A colisao e feita por MASCARA:
# o texto e rasterizado uma vez numa imagem e o jogo consulta o alpha do
# pixel sob o jogador — a hitbox e o proprio desenho, letra por letra.
clayton.latex.hp=500
clayton.latex.duracao=2600
# Pixels por tick que a pagina desce. Maior = menos tempo pra achar a brecha.
clayton.latex.velocidade=1.15
# Tamanho da fonte e espacamento. Fonte MAIOR = letras mais grossas, mas
# tambem espacos maiores; alturaLinha maior = mais entrelinha pra escapar.
# Fonte em NEGRITO (ver LatexSpell), pra parede de texto ficar solida.
# Em negrito cabem ~42 caracteres por linha nos 600px do campo — aumentar
# mais que isso faz as linhas do artigo serem cortadas na borda.
clayton.latex.tamanhoFonte=25
# Entrelinha. Maior = corredor horizontal mais largo entre as linhas do
# artigo, entao da pra ESCOLHER por qual linha passar em vez de so achar
# a primeira brecha.
clayton.latex.alturaLinha=48
clayton.latex.margemEsquerda=18
# ESPACAMENTO (o que abre os "corredores" no meio do texto):
#   entreLetras   = pixels a mais entre cada letra -> frestas finas
#   extraPalavra  = pixels a mais em cada espaco   -> corredores verticais
# Subir estes valores deixa o ataque MAIS FACIL, mas encurta quantos
# caracteres cabem por linha (com 2 e 7 cabem ~34; acima disso o artigo
# e cortado na borda).
clayton.latex.espacoEntreLetras=2
clayton.latex.espacoExtraPalavra=8
# Recuo da coluna de numeros de linha (o "% 12" alinhado a direita).
# Ela existe pra faixa direita do campo nao virar corredor seguro.
clayton.latex.margemDireita=14
# Espera antes do texto comecar a descer (deixa a voiceline soar)
clayton.latex.ticksDeEspera=100
# Ticks de imunidade depois de encostar na tinta. Sem isso o jogador
# perderia todas as vidas num piscar, ja que o texto e continuo.
clayton.latex.intervaloDeDano=30
# Quanto do raio do jogador conta contra a tinta (0 a 1). As letras
# continuam do mesmo tamanho; o jogador so precisa entrar mais fundo nelas
# pra levar dano.
clayton.latex.fatorHitbox=0.55


# =====================================================
# PAPA — chefe final (Roteiro.txt linhas 58 a 82)
# =====================================================

papa.sprite=sprites/bosses/papa-base.png
papa.escalaSprite=3.4
papa.spriteIA=sprites/bosses/papa-IA_MALIGNA.png

# Tema proprio do chefe final. A fase troca a trilha ao spawnar ele e
# volta pra musica.arquivo quando a luta acaba.
# LEMBRE: javax.sound so le WAV. O .mp3 original foi convertido com
#   ffmpeg -i "flower man.mp3" -ar 22050 -ac 2 -acodec pcm_s16le flower_man.wav
papa.musica=audio/flower_man.wav
papa.escalaSpriteIA=4.0

# --- SPELL 1: Tratado de Nao-Proliferacao (bandeiras) ---
# Bandeiras de paises sorteados nascem em leva, GIRAM mirando o jogador e
# depois avancam na direcao travada. O catalogo de paises fica em
# src/Bandeira.java (uma linha por pais).
papa.bandeiras.hp=420
papa.bandeiras.duracao=2000

# Quantas bandeiras por leva, e de quantos em quantos ticks nasce uma leva.
# A leva inteira mira junta: e isso que faz o ataque ser LIDO de uma vez
# em vez de virar um chuvisco de reacoes separadas.
papa.bandeiras.porLeva=6
papa.bandeiras.intervaloEntreLevas=64

# Quanto tempo ela persegue com o giro antes de travar a direcao,
# e quanto tempo fica travada piscando antes de sair.
# ticksTravada e a JANELA DE FUGA — encurtar isso e o que mais
# aumenta a dificuldade do ataque inteiro. Com 11 ticks o jogador anda
# 44 px andando normal (19 no foco) e precisa de 14 px pra sair da linha:
# da, mas exige reagir, nao passear. NAO desca de ~8 sem testar.
papa.bandeiras.ticksDeMira=34
papa.bandeiras.ticksTravada=11

# Radianos por tick de correcao da mira. Alto demais e ela vira teleguiada
# e andar de lado deixa de funcionar.
papa.bandeiras.taxaDeGiro=0.075

papa.bandeiras.velocidade=7.4
papa.bandeiras.raio=11.0

# Tamanho do pano em relacao a hitbox. Acima de 1 o desenho e maior que a
# colisao — generoso de proposito, ja que a bandeira e um retangulo grande.
papa.bandeiras.escalaSprite=1.9

# Onde a leva nasce: um arco de 'aberturaDoArco' radianos, a
# 'raioDeSpawn' pixels da chefe, sempre virado pra baixo.
papa.bandeiras.raioDeSpawn=170
papa.bandeiras.aberturaDoArco=2.4

# Quanto tempo o nome do pais fica no rodape.
papa.bandeiras.ticksNomeNaTela=90

# Semente do sorteio de paises. >= 0 fixa a sequencia (util pra testar).
papa.bandeiras.seed=-1

# --- SPELL 2: Maquina de Turing (digitacao) ---
# O jogador e TRAVADO dentro de um cabecote sobre a fita e tem que digitar
# o simbolo de cada celula antes do relogio dela zerar.
papa.turing.hp=240
papa.turing.duracao=999999

# Simbolos possiveis. NAO inclua C, V, X nem Z: sao teclas de acao (foco,
# bomba, tiro) e o jogador nao conseguiria digita-las sem efeito colateral.
papa.turing.alfabeto=01ABDEFGHIJKLMNOPQRSTUWY

# Quantas celulas o programa tem.
papa.turing.tamanhoDaFita=24

# Relogio da primeira celula, quanto ele encurta a cada celula resolvida,
# e o piso. 130 ticks = ~2,2 segundos por letra no comeco.
papa.turing.tempoInicial=130
papa.turing.aceleracao=3.5
papa.turing.tempoMinimo=55

# Dano no PAPA por simbolo certo. Durante este ataque o TIRO E A BOMBA
# ficam desligados, entao digitar e a UNICA fonte de dano — e por isso
# tamanhoDaFita * danoPorAcerto tem que dar exatamente o hp acima
# (24 * 10 = 240). Se mexer num, mexa nos tres, senao o ataque ou acaba
# antes da fita terminar ou nao acaba nunca.
# A duracao e enorme pelo mesmo motivo: o unico jeito de sair daqui e
# terminando o programa.
papa.turing.danoPorAcerto=10

# Aparencia da fita.
papa.turing.larguraCelula=62
papa.turing.alturaRelY=0.62

# Semente da fita. >= 0 gera sempre o mesmo programa.
papa.turing.seed=-1

# --- SPELL 3: Optimum Path Forest (forma IA) ---
# Prototipos competem pelas amostras com custo fmax; cada aresta vencedora
# vira um feixe de balas. O no do jogador e o indice 0 — quando a floresta
# chega nele, a arvore que o conquistou dispara o veredito.
papa.opf.hp=520
papa.opf.duracao=2600

# Quantas raizes e quantas amostras. MAIS prototipos = mais arvores e
# feixes vindo de mais direcoes; mais amostras = ciclo mais longo.
papa.opf.prototipos=3
papa.opf.amostras=9

# Ritmo. ticksDeAviso e quanto tempo a aresta candidata fica PISCANDO
# antes de virar bala — e a leitura do ataque inteiro; baixar muito
# devolve a versao ilegivel. ticksEntreConquistas e a respirada depois de
# cada disparo, e ticksDeAlivio a pausa quando a floresta fecha.
papa.opf.ticksDeAviso=30
papa.opf.ticksEntreConquistas=16
papa.opf.ticksDeAlivio=120

# O feixe de cada aresta: quantas balas, velocidade, raio e o espaco entre
# elas. As balas nascem escalonadas PRA TRAS da origem, entao o feixe
# entra como uma linha se estendendo.
papa.opf.balasPorAresta=10
papa.opf.velocidadeBala=2.6
papa.opf.raioBala=6.0
papa.opf.espacamentoNoFeixe=15

# O leque MIRADO que toda amostra conquistada cospe no jogador. E o que
# impede o ataque de ser passado parado — sem ele os feixes seguem a
# geometria do grafo e quase nunca acertam quem nao se mexe.
papa.opf.balasDoNo=5
papa.opf.aberturaDoNo=0.55
papa.opf.velocidadeDoNo=3.4

# O veredito: o leque grande que sai quando o no do JOGADOR e
# classificado. Acontece uma vez por ciclo e e o clima do ataque.
papa.opf.balasDoVeredito=15
papa.opf.aberturaDoVeredito=1.3

# Distancia minima dos nos ate a borda do campo.
papa.opf.margem=60

# Semente das amostras. >= 0 gera sempre a mesma floresta.
papa.opf.seed=-1
