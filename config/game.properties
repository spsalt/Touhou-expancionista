adriana.cachorros.abertura=0.42
adriana.cachorros.velocidadeBala=3.1
adriana.cachorros.raioBala=9.0
adriana.cachorros.tamanhoDaFonte=22

# --- o anel esparso da propria Adriana ---
# So pra o centro do campo nao virar zona de descanso enquanto o jogador
# caça cachorro. Esparso de proposito: se exigisse atencao de verdade,
